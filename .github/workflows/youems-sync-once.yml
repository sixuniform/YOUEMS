name: YOUEMS one-shot PV availability sync

on:
  push:
    branches: [main]
    paths:
      - '.sync/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical YOUEMS update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          p = Path('solinteg_schedule.yaml')
          s = p.read_text()
          s = one(s, 'state: "2026.08.25.16.31"', 'state: "2026.08.27.00.18"', 'version')
          s = one(s, '''  youems_pv_shortfall_response_pct:
            name: "PV Shortfall Response"
            min: 5
            max: 100
            step: 5
          ''', '''  youems_pv_shortfall_response_pct:
            name: "PV Shortfall Response"
            min: 1
            max: 100
            step: 1
          ''', 'shortfall helper')
          s = one(s, '''          energy_weight_rule: "learning response is scaled by expected P50 energy / 3.0 kWh, capped at 100%"
          ''', '''          energy_weight_rule: "shortfall response is scaled by expected P50 energy / 3.0 kWh, capped at 100%; recovery is not energy-weighted"
          ''', 'energy rule')
          s = one(s, '''      Recovery uses actual/P50. Learning response is weighted by total expected P50
                energy so low-energy sunrise/sunset deviations have little influence while large
                daytime shortfalls remain important. Learning runs even when PV Forecast Adaptation
          ''', '''      Recovery uses actual/P50. Downward learning response is weighted by total expected
                P50 energy so low-energy sunrise/sunset deviations have little influence while
                large daytime shortfalls remain important. Recovery is deliberately not
                energy-weighted, allowing a valid clear-panel/clear-weather period to restore
                confidence quickly. Learning runs even when PV Forecast Adaptation
          ''', 'learner description')
          s = one(s, '''          effective_shortfall_response: >
                    {{ shortfall_response | float(0.50) * learning_energy_weight | float(0) }}
                  effective_recovery_response: >
                    {{ recovery_response | float(0.40) * learning_energy_weight | float(0) }}
          ''', '''          effective_shortfall_response: >
                    {{ shortfall_response | float(0.50) * learning_energy_weight | float(0) }}
                  effective_recovery_response: >
                    {{ recovery_response | float(0.40) }}
          ''', 'recovery response')
          p.write_text(s)

          p = Path('README.md')
          r = p.read_text()
          r = one(r, '- Scheduler: `v2026.08.25.16.31`', '- Scheduler: `v2026.08.27.00.18`', 'README version')
          anchor = '## Inverter communication watchdog\n'
          note = '''### PV Availability snow-oriented response (2026.08.27.00.18)

          PV Availability is primarily a long-duration snow/obstruction detector and secondarily
          a persistent bad-weather correction. Its response is therefore intentionally asymmetric.

          The `PV Shortfall Response` control now allows **1% steps from 1–100%** (previously the
          minimum was 5%). Downward learning keeps the energy-significance weighting introduced in
          v2026.08.25.16.31:

          `effective shortfall response = configured shortfall × min(P50 energy / 3.0 kWh, 1)`

          Recovery no longer receives that energy weighting:

          `effective recovery response = configured recovery`

          This means low-energy sunrise/sunset misses barely pull Availability downward, sustained
          large daytime deficits can still accumulate over many observations, and a valid recovery
          period can restore confidence rapidly even when forecast energy is only moderate.

          The response controls are per accepted 30-minute observation, not per day. For example,
          with a full-weight 36.5% observation, a 10% shortfall response gives approximately
          `100 → 93.7 → 87.9%` in two accepted periods. For snow-oriented operation, **1–2%**
          shortfall with **80–90% recovery** is a better starting range.

          '''
          if note.strip() not in r:
              if r.count(anchor) != 1:
                  raise SystemExit(f'README anchor count {r.count(anchor)}')
              r = r.replace(anchor, note + anchor, 1)
          p.write_text(r)
          PY

          rm -rf .sync
          rm -f .github/workflows/youems-sync-once.yml
          git config user.name 'YOUEMS sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Tune PV availability for snow detection'
          git push
