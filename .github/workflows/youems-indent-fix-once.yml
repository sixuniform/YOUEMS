name: YOUEMS scheduler indent fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youems-indent-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair YAML indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('solinteg_schedule.yaml')
          s = p.read_text(encoding='utf-8')
          bad = '\n'.join([
              '          notify_feed_candidate_ts: >-',
              '  {% set opening = notify_feed_diag.op | default(0) | int(0) %}',
              '  {% set safe_end = notify_feed_diag.se | default(0) | int(0) %}',
              '  {{ opening if opening > 0 else safe_end }}',
          ])
          ind = ' ' * 12
          good = '\n'.join([
              '          notify_feed_candidate_ts: >-',
              ind + '{% set opening = notify_feed_diag.op | default(0) | int(0) %}',
              ind + '{% set safe_end = notify_feed_diag.se | default(0) | int(0) %}',
              ind + '{{ opening if opening > 0 else safe_end }}',
          ])
          if bad not in s:
              raise SystemExit('Expected malformed block not found')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          PY
          git config user.name 'YOUEMS sync'
          git config user.email 'actions@users.noreply.github.com'
          git add solinteg_schedule.yaml
          git commit -m 'Repair planner reporting YAML indentation'
          git push
