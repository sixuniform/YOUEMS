          kw: "{{ states('input_number.schedule_' ~ slot_id ~ '_power_kw') | float(0) }}"
          # Manual schedule slots 01-05 are explicit operator commands and must
          # not inherit the automatic planner's Sell-SOC override. Slots 06-40
          # remain source=schedule so the automatic SOC guard still protects them.
          schedule_source: "{{ 'manual_schedule' if slot_id | int(0) <= 5 else 'schedule' }}"
      - if:
          - condition: template
            value_template: '{{ manual_active and slot_id | int(0) > 5 }}'
        then:
          - stop: Manual slot active — skipping auto slot {{ slot_id }}
      - action: input_text.set_value
        target:
          entity_id: input_text.active_schedule_slot
        data:
          value: '{{ slot_id }}'
      # A new schedule owns the control decision. Clear any hold left by a
      # previous Feed-In/Battery Discharge SOC guard; qems_start will set it
      # again if this new schedule is also below the effective Sell floor.
      - action: input_text.set_value
        target:
          entity_id: input_text.qems_soc_guarded_schedule_slot
        data:
          value: ''
      - action: input_text.set_value
        target:
          entity_id: input_text.schedule_active_mode
        data:
          value: |
            {%- if sched_type in ['qEMS Battery Charge', 'qEMS Battery Discharge'] -%}
            {{ sched_type }}, {{ kw }} kW
            {%- else -%}
            {{ sched_type }}
            {%- endif -%}
      - if:
          - condition: template
            value_template: "{{ sched_type in ['Self-Consumption', 'qEMS Feed-In', 'qEMS Self-Consumption', 'qEMS PV Charge', 'qEMS PV Charge+House', 'qEMS Battery Charge', 'qEMS Battery Discharge', 'qEMS Battery Freeze'] }}"
        then:
          - variables:
              _h_type: '{{ sched_type }}'
              _h_s: "{{ (states('input_datetime.schedule_' ~ slot_id ~ '_start') | as_datetime | as_local).timestamp() | int }}"
              _h_e: "{{ (states('input_datetime.schedule_' ~ slot_id ~ '_end') | as_datetime | as_local).timestamp() | int }}"
              _h_code: |
                {%- if _h_type == 'qEMS Battery Discharge' %}D
                {%- elif _h_type == 'qEMS Battery Charge' %}C
                {%- elif _h_type == 'qEMS Battery Freeze' %}F
                {%- elif _h_type in ['Self-Consumption', 'qEMS Self-Consumption'] %}S
                {%- elif _h_type == 'qEMS PV Charge+House' %}P
                {%- elif _h_type == 'qEMS Feed-In' %}I
                {%- elif _h_type == 'qEMS PV Charge' %}E
                {%- else %}S{%- endif %}
              _h_new: |
                {%- set cur = states('input_text.schedule_history') -%}
                {%- set ref_epoch = 1704067200 -%}
                {%- set new_idx = ((_h_s - ref_epoch) // 900) | int -%}
                {%- set new_n = ((_h_e - _h_s) // 900) | int if (slot_id | int) <= 5 else 1 -%}
                {%- set entry = new_idx | string ~ '|' ~ new_n | string ~ '|' ~ _h_code -%}
                {#- History is newest-first and input_text is limited to 255 chars.
                    Normalize the whole stream on every write so schedule watchdog
                    re-entry is idempotent: duplicate/contained/overlapping/adjacent
                    intervals of the same mode collapse to one union interval. This
                    also repairs history previously fragmented by repeated starts. -#}
                {%- set combined = entry ~ (';' ~ cur if cur not in ['','unknown','unavailable'] else '') -%}
                {%- set ns = namespace(items=[]) -%}
                {%- for raw_entry in combined.split(';') if raw_entry != '' -%}
                  {%- set p = raw_entry.split('|') -%}
                  {%- if p | length == 3 -%}
                    {%- set e_idx = p[0] | int -%}
                    {%- set e_n = p[1] | int -%}
                    {%- set e_code = p[2] -%}
                    {%- set e_end = e_idx + e_n -%}
                    {%- if e_n > 0 -%}
                      {%- if ns.items | length > 0 -%}
                        {%- set lp = ns.items[-1].split('|') -%}
                        {%- set l_idx = lp[0] | int -%}
                        {%- set l_n = lp[1] | int -%}
                        {%- set l_code = lp[2] -%}
                        {%- set l_end = l_idx + l_n -%}
                      {%- else -%}
                        {%- set l_idx = 0 -%}
                        {%- set l_end = 0 -%}
                        {%- set l_code = '' -%}
                      {%- endif -%}
                      {%- if ns.items | length > 0
                            and e_code == l_code
                            and e_idx <= l_end
                            and e_end >= l_idx -%}
                        {%- set union_start = [e_idx, l_idx] | min -%}
                        {%- set union_end = [e_end, l_end] | max -%}
                        {%- set merged = union_start | string ~ '|' ~ (union_end - union_start) | string ~ '|' ~ e_code -%}
                        {%- set ns.items = ns.items[:-1] + [merged] -%}
                      {%- else -%}
                        {%- set ns.items = ns.items + [e_idx | string ~ '|' ~ e_n | string ~ '|' ~ e_code] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set out = namespace(v=ns.items | join(';')) -%}
                {#- Remove oldest complete entries only; never cut an encoded entry. -#}
                {%- for _ in range(30) -%}
                  {%- if out.v | length > 255 -%}
                    {%- set cut = out.v.rfind(';') -%}
                    {%- set out.v = out.v[:cut] if cut > 0 else out.v[:255] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ out.v }}
          - action: input_text.set_value
            target:
              entity_id: input_text.schedule_history
            data:
              value: '{{ _h_new[:255] }}'
      - if:
          - condition: template
            value_template: "{{ states('input_text.pre_schedule_working_mode') == '' }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.pre_schedule_working_mode
            data:
              value: "{{ states('select.solax_inverter_working_mode') }}"
      - if:
          - condition: state
            entity_id: input_boolean.dry_run
            state: "off"
        then:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ sched_type == 'Self-Consumption' }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ states('select.solax_inverter_working_mode') != 'EMS General'
                             or is_state('input_boolean.qems_controller_enabled', 'on') }}
                    then:
                      - action: script.qems_stop
                        data:
                          restore_previous: false
                      - if:
                          - condition: template
                            value_template: "{{ states('select.solax_inverter_working_mode') != 'EMS General' }}"
                        then:
                          - action: select.select_option
                            target:
                              entity_id: select.solax_inverter_working_mode
                            data:
                              option: EMS General
              - conditions:
                  - condition: template
                    value_template: "{{ sched_type in ['qEMS Battery Charge', 'qEMS Battery Discharge'] }}"
                sequence:
                  - action: script.qems_start
                    data:
                      mode: '{{ sched_type }}'
                      requested_power_kw: '{{ kw }}'
                      source: '{{ schedule_source }}'
                      force_apply: false
              - conditions:
                  - condition: template
                    value_template: "{{ sched_type in ['qEMS Feed-In', 'qEMS Self-Consumption', 'qEMS PV Charge', 'qEMS PV Charge+House', 'qEMS Battery Freeze'] }}"
                sequence:
                  - action: script.qems_start
                    data:
                      mode: '{{ sched_type }}'
                      source: '{{ schedule_source }}'
                      force_apply: false
        else:
          - action: persistent_notification.create
            data:
              title: 🧪 DRY RUN — Schedule Start
              message: |
                Schedule {{ slot_id }} would start {{ sched_type }}{% if sched_type in ['qEMS Battery Charge', 'qEMS Battery Discharge'] %} at {{ kw }} kW{% endif %}.
                Self-Consumption would select EMS General only if needed; qEMS modes would initialize EMS parameters only when the active sub-mode differs. No battery current-limit register would be changed.
    mode: single

