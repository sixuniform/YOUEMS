  # Immutable per-cycle original prices prevent Late Charge/Sell Acceptance
  # from being applied repeatedly against an already shifted plan on every replan.
  # Manual Battery Charge/Discharge topology changes explicitly clear these
  # anchors because their protected-slot layout/energy budget has changed.
  # A zero Late setting clears and bypasses these helpers completely.
  # Late Charge and Late Sell both store the last planned destination as a
  # 15-minute offset from their cycle-day midnight together with the immutable
  # original price. Executed/missed anchors can then be retired without shifting
  # the remaining allocation ranks:
  # YYYYMMDD|destination_slot_offset:price_in_hundredths,...
  youems_auto_charge_late_charge_anchor:
    name: "YOUEMS Auto Charge Late Charge Anchor"
