          guarded_slot: "{{ states('input_text.qems_soc_guarded_schedule_slot') }}"
          ending_slot: "{{ states('input_text.active_schedule_slot') }}"
      - if:
          - condition: template
            value_template: "{{ next_slot != '' }}"
        then:
          - stop: Next schedule {{ next_slot }} starts now — direct handoff without post-behavior
      # A scheduled Feed-In/Battery Discharge that hit the Sell-SOC floor was
      # deliberately replaced by native Self-Consumption. Do not let the old
      # slot's end event apply its configured post-behavior and undo that hold.
      - if:
          - condition: template
            value_template: >-
              {{ guarded_slot not in ['', 'unknown', 'unavailable']
                 and guarded_slot == ending_slot }}
        then:
          - action: input_text.set_value
