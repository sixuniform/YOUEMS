      - action: input_select.select_option
        target:
          entity_id: input_select.schedule_edit_type
        data:
          option: "{{ states('input_select.schedule_' ~ slot_id ~ '_type') }}"
      # Load existing dates when editing an enabled slot.
      # For disabled slots, set smart defaults: next 15-min boundary + today 23:45.
      - if:
          - condition: template
            value_template: >
              {{ is_state('input_boolean.schedule_' ~ slot_id ~ '_enabled', 'on')
                 and states('input_datetime.schedule_' ~ slot_id ~ '_start')
                     not in ['unknown','unavailable'] }}
        then:
          - action: input_datetime.set_datetime
