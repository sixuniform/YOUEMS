            data:
              datetime: >
                {% set _t = (as_timestamp(now()) | int // 900 + 1) * 900 %}
                {{ _t | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.schedule_edit_end
            data:
              datetime: "{{ now().strftime('%Y-%m-%d') ~ ' 23:45:00' }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.schedule_edit_power_kw
        data:
          value: "{{ states('input_number.schedule_' ~ slot_id ~ '_power_kw') | float(3.0) }}"
