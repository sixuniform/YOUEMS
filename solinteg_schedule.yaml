      - name: "qEMS Controller Status"
        unique_id: qems_controller_status
        icon: mdi:bug-outline
        state: "{{ states('input_text.qems_controller_status') }}"

      - name: "qEMS Controller Status Snapshot"
        unique_id: qems_controller_status_snapshot
        icon: mdi:content-copy
        state: "{{ states('input_text.qems_controller_status_snapshot') }}"

      - name: "Active Test Mode"
        unique_id: qems_active_mode
        icon: mdi:chip
        state: >
          {{ states('input_text.qems_active_mode') if states('input_text.qems_active_mode') not in ['', 'Off', 'unknown', 'unavailable'] else 'Off' }}

      - name: "qEMS Calculated House Load"
        unique_id: qems_calculated_house_load
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt-outline
        state: >
          {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
          {%- set batt = states('sensor.solax_inverter_battery_power') | float(0) / 1000 -%}
          {# Native Solax meter: positive = grid export, negative = grid import. #}
          {%- set grid = states('sensor.solax_inverter_meter_active_power') | float(0) / 1000 -%}
          {{ ([pv + batt - grid, 0] | max) | round(3) }}

      - name: "YOUEMS Allowed Export"
        unique_id: youems_allowed_export
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:transmission-tower-export
        state: >
          {# Site inverter is Solinteg MHT-10K-25: 100% = 10.0 kW. #}
          {% set pct = states('input_number.auto_export_limit_limit_pct') | float(10) %}
          {{ ([[pct, 0] | max, 100] | min * 0.10) | round(2) }}
        attributes:
          configured_pct: "{{ states('input_number.auto_export_limit_limit_pct') | float(10) | round(0) }}"
          inverter_nominal_kw: 10.0
          semantics: "Maximum site export buffer while negative-price guard is active"

      - name: "YOUEMS Export Guard Output Cap"
        unique_id: youems_export_guard_output_cap
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:transmission-tower
        availability: >
          {{ is_number(states('sensor.solax_inverter_pv_power_total'))
             and is_number(states('sensor.solax_inverter_battery_power'))
             and is_number(states('sensor.solax_inverter_meter_active_power')) }}
        state: >
          {% if is_state('input_boolean.auto_export_limit_enabled', 'on') and is_state('input_boolean.auto_export_limit_active', 'on') %}
            {% set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 %}
            {% set batt = states('sensor.solax_inverter_battery_power') | float(0) / 1000 %}
            {% set grid_raw = states('sensor.solax_inverter_meter_active_power') | float(0) / 1000 %}
            {% set deadband = states('input_number.qems_grid_deadband_kw') | float(0.01) %}
            {% set grid = 0 if grid_raw | abs < deadband else grid_raw %}
            {% set house = [pv + batt - grid, 0] | max %}
            {% set buffer = states('sensor.youems_allowed_export') | float(1.0) %}
            {{ ([[house + buffer, 0] | max, 200] | min) | round(2) }}
          {% else %}
            200
          {% endif %}
        attributes:
          active: "{{ is_state('input_boolean.auto_export_limit_enabled', 'on') and is_state('input_boolean.auto_export_limit_active', 'on') }}"
          house_load_kw: >
            {% set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 %}
            {% set batt = states('sensor.solax_inverter_battery_power') | float(0) / 1000 %}
            {% set grid_raw = states('sensor.solax_inverter_meter_active_power') | float(0) / 1000 %}
            {% set deadband = states('input_number.qems_grid_deadband_kw') | float(0.01) %}
            {% set grid = 0 if grid_raw | abs < deadband else grid_raw %}
            {{ ([pv + batt - grid, 0] | max) | round(3) }}
          grid_deadband_kw: "{{ states('input_number.qems_grid_deadband_kw') | float(0.01) }}"
          allowed_site_export_kw: "{{ states('sensor.youems_allowed_export') | float(1.0) | round(2) }}"
          current_ems_output_limit_kw: "{{ states('number.solinteg_inverter_solax_inverter_ems_battctrl_max_ac_power_limit') | float(0) | round(2) }}"
          formula: "maximum inverter AC output = calculated house load + allowed site export"
          battery_charge_note: "Battery charging is not added separately; it already reduces inverter AC output"

      - name: "qEMS Export Negative Price Guard Status"
        unique_id: youems_export_guard_status
        icon: mdi:transmission-tower
        state: >
          {% if not is_state('input_boolean.auto_export_limit_enabled', 'on') %}
            Disabled
          {% elif is_state('input_boolean.auto_export_limit_active', 'on') %}
            Active
          {% else %}
            Armed
          {% endif %}
        attributes:
          price_ore: "{{ (states('sensor.nordpool_kwh_se3_sek_5_00_0') | float(0) * 100) | round(1) }}"
          activation_rule: "Nord Pool sell price < 0"
          allowed_export_pct: "{{ states('input_number.auto_export_limit_limit_pct') | float(10) | round(0) }}"
          allowed_export_kw: "{{ states('sensor.youems_allowed_export') | float(1.0) | round(2) }}"
          desired_output_cap_kw: "{{ states('sensor.youems_export_guard_output_cap') | float(200) | round(2) }}"
          current_output_cap_kw: "{{ states('number.solinteg_inverter_solax_inverter_ems_battctrl_max_ac_power_limit') | float(0) | round(2) }}"

      - name: "qEMS Inverter Output"
        unique_id: qems_inverter_output
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:home-export-outline
        state: >
          {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
          {%- set batt = states('sensor.solax_inverter_battery_power') | float(0) / 1000 -%}
          {{ (pv + batt) | round(3) }}

      - name: "qEMS Raw Target"
        unique_id: qems_raw_target
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:target
        state: >
          {%- set mode = states('input_text.qems_active_mode') -%}
          {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
          {%- set batt = states('sensor.solax_inverter_battery_power') | float(0) / 1000 -%}
          {# Native Solax meter: positive = grid export, negative = grid import. #}
          {%- set grid_raw = states('sensor.solax_inverter_meter_active_power') | float(0) / 1000 -%}
          {%- set deadband = states('input_number.qems_grid_deadband_kw') | float(0.01) -%}
          {%- set grid = 0 if (grid_raw | abs) < deadband else grid_raw -%}
          {%- set house = [pv + batt - grid, 0] | max -%}
          {%- set requested = states('input_number.qems_requested_power_kw') | float(0) -%}
          {%- set maximum = states('input_number.qems_max_target_kw') | float(10) -%}
          {# BattCtrl target is battery power: + discharge, - charge.
             With the native Solax grid sign (+ export / - import),
             current net demand after PV is battery - grid. #}
          {%- set net_after_pv = batt - grid -%}
          {%- if mode == 'qEMS Feed-In' -%}
            {%- set target = [net_after_pv, 0] | max -%}
          {%- elif mode == 'qEMS Self-Consumption' -%}
            {%- set target = net_after_pv -%}
          {%- elif mode == 'qEMS PV Charge' -%}
            {# Saturated charge request. Inverter import is hard-limited to 0 kW,
               while output is effectively unlimited at +200 kW, so available PV can
               charge the battery without chasing a moving PV sensor and excess PV may export. #}
            {%- set target = -maximum -%}
          {%- elif mode == 'qEMS PV Charge+House' -%}
            {# Charge only with the measured PV surplus. Export remains unlimited,
               so excess PV can still leave the site when the battery is full or limited. #}
            {%- set target = [net_after_pv, 0] | min -%}
          {%- elif mode == 'qEMS Battery Charge' -%}
            {# Requested charge is a minimum battery-charge magnitude. If measured
               PV surplus is larger, make the target more negative so the battery
               absorbs that surplus instead of exporting it at the cheap charge time. #}
            {%- set target = [-requested, net_after_pv] | min -%}
          {%- elif mode == 'qEMS Battery Discharge' -%}
            {%- set target = [requested, net_after_pv, 0] | max -%}
          {%- elif mode == 'qEMS Battery Freeze' -%}
            {%- set target = 0 -%}
          {%- else -%}
            {%- set target = 0 -%}
          {%- endif -%}
          {{ ([[target, maximum] | min, -maximum] | max) | round(3) }}

      - name: "qEMS Desired Max Inverter Output"
        unique_id: qems_desired_max_inverter_output
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:transmission-tower-export
        state: >
          {%- set mode = states('input_text.qems_active_mode') -%}
          {%- set guard_active = is_state('input_boolean.auto_export_limit_enabled', 'on') and is_state('input_boolean.auto_export_limit_active', 'on') -%}
          {%- set guard_cap = states('sensor.youems_export_guard_output_cap') | float(200)
                if is_number(states('sensor.youems_export_guard_output_cap')) else 200 -%}
          {# Battery Freeze freezes battery movement with target=0 and inverter input=0;
             inverter output stays open so PV may serve the house/export normally. The
             negative-price guard may still independently reduce 50208. #}
          {{ [200, guard_cap] | min if guard_active
             else (200 if mode not in ['', 'Off', 'unknown', 'unavailable'] else 0) }}

      - name: "qEMS Desired Max Inverter Input"
        unique_id: qems_desired_max_inverter_input
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:transmission-tower-import
        state: >
          {%- set mode = states('input_text.qems_active_mode') -%}
          {# Observed firmware semantics: 0 kW blocks inverter import; -200 kW is
             effectively unlimited inverter input. #}
          {{ 0 if mode in ['qEMS Feed-In', 'qEMS Battery Discharge',
                           'qEMS PV Charge', 'qEMS PV Charge+House', 'qEMS Battery Freeze']
             else (-200 if mode in ['qEMS Self-Consumption', 'qEMS Battery Charge'] else 0) }}

      - name: "qEMS Expected Battery Power"
        unique_id: qems_expected_battery_power
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:battery-arrow-up-down
        state: >
          {%- set mode = states('input_text.qems_active_mode') -%}
          {%- if mode == 'qEMS PV Charge' -%}
            {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
            {%- set maximum = states('input_number.qems_max_target_kw') | float(10) -%}
            {%- set charge_allowed = states('sensor.solax_inverter_battery_charge_limit') | float(0) > 0.05 -%}
            {{ (-([pv, maximum] | min) if charge_allowed else 0) | round(3) }}
          {%- elif mode == 'qEMS PV Charge+House' -%}
            {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
            {%- set house = states('sensor.qems_calculated_house_load') | float(0) -%}
            {%- set maximum = states('input_number.qems_max_target_kw') | float(10) -%}
            {%- set charge_allowed = states('sensor.solax_inverter_battery_charge_limit') | float(0) > 0.05 -%}
            {%- set surplus = [[pv - house, maximum] | min, 0] | max -%}
            {{ (-surplus if charge_allowed else 0) | round(3) }}
          {%- elif mode in ['qEMS Feed-In', 'qEMS Self-Consumption',
                           'qEMS Battery Charge', 'qEMS Battery Discharge',
                           'qEMS Battery Freeze'] -%}
            {{ states('sensor.qems_raw_target') | float(0) | round(3) }}
          {%- else -%}
            0
          {%- endif -%}

      - name: "qEMS Target Error"
        unique_id: qems_target_error
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:delta
        state: >
          {{ (states('sensor.qems_expected_battery_power') | float(0)
              - (states('sensor.solax_inverter_battery_power') | float(0) / 1000)) | round(3) }}

      # Diagnostic-only estimates from the BMS-reported current permissions.
      # The inverter/BMS remains responsible for enforcing the real limits; qEMS
      # uses zero/non-zero current only as a directional permission gate.
      - name: "qEMS BMS Approx Max Charge Power"
        unique_id: qems_bms_approx_max_charge_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-down-outline
        state: >
          {%- set voltage_state = states('sensor.solax_inverter_battery_voltage') -%}
          {%- set current_state = states('sensor.solax_inverter_battery_charge_limit') -%}
          {%- if is_number(voltage_state) and is_number(current_state) -%}
            {%- set voltage = voltage_state | float(0) -%}
            {%- set current = [current_state | float(0), 0] | max -%}
            {{ (voltage * current / 1000) | round(2) }}
          {%- else -%}
            {{ none }}
          {%- endif -%}

      - name: "qEMS BMS Approx Max Discharge Power"
        unique_id: qems_bms_approx_max_discharge_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-up-outline
        state: >
          {%- set voltage_state = states('sensor.solax_inverter_battery_voltage') -%}
          {%- set current_state = states('sensor.solax_inverter_battery_discharge_limit') -%}
          {%- if is_number(voltage_state) and is_number(current_state) -%}
            {%- set voltage = voltage_state | float(0) -%}
            {# The inverter exposes the discharge permission as positive amperes. #}
            {%- set current = [current_state | float(0), 0] | max -%}
            {{ (voltage * current / 1000) | round(2) }}
          {%- else -%}
            {{ none }}
          {%- endif -%}

