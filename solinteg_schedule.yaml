            data:
              value: ''
          - action: input_text.set_value
            target:
              entity_id: input_text.schedule_active_mode
            data:
              value: Unscheduled
          - stop: SOC-guarded slot ended — keep native Self-Consumption until the next schedule starts
      - action: input_text.set_value
        target:
          entity_id: input_text.active_schedule_slot
        data:
          value: ''
      - if:
          - condition: state
            entity_id: input_boolean.dry_run
            state: "off"
        then:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ post_behavior == 'Do Nothing' }}"
                sequence: []
              - conditions:
                  - condition: template
                    value_template: "{{ post_behavior == 'Restore Previous' }}"
                sequence:
                  - action: script.qems_stop
                    data:
                      restore_previous: false
                  - variables:
                      safe_restore_mode: >
