sensor:
  - platform: integration
    source: sensor.solax_inverter_pv_power_total
    name: "YOUEMS PV Learning Energy"
    unique_id: youems_pv_learning_energy
    unit_prefix: k
    unit_time: h
    round: 5
    method: trapezoidal
    max_sub_interval:
      minutes: 1

template:

  - sensor:
      - name: "YOUEMS Charge Loss"
        unique_id: youems_charge_loss
        unit_of_measurement: "%"
        icon: mdi:battery-charging-outline
        state: >
          {% set samples = states('input_number.youems_shadow_charge_loss_samples') | int(0) %}
          {% set learned = states('input_number.youems_shadow_charge_loss_pct') %}
          {% if samples > 0 and is_number(learned) %}
            {{ ([[learned | float(2.5), 0] | max, 5] | min) | round(3) }}
          {% else %}
            2.500
          {% endif %}
        attributes:
          source: >
            {{ 'learned full-to-full average'
               if states('input_number.youems_shadow_charge_loss_samples') | int(0) > 0
               else 'default until first qualified full-to-full cycle' }}
          default_pct: 2.5
          samples: "{{ states('input_number.youems_shadow_charge_loss_samples') | int(0) }}"
          effective_weight_kwh: "{{ states('input_number.youems_shadow_charge_loss_weight_kwh') | float(0) | round(3) }}"
          last_update: "{{ states('input_text.youems_shadow_charge_loss_last_update') }}"
          last_attempt: "{{ states('input_text.youems_shadow_charge_loss_last_attempt') }}"
          cycle_contaminated: "{{ is_state('input_boolean.youems_shadow_charge_loss_cycle_contaminated', 'on') }}"
          learning_method: "Automatic full-to-full closure using stitched charge/discharge energy; throughput-weighted running average"
          min_cycle_depth: "20% of previous full-anchor energy, minimum 2.0 kWh"
          valid_observation_range_pct: "0–5"
          prior_default_weight_kwh: 10
          rolling_history_weight_cap_kwh: 50

      - name: "YOUEMS Inverter Communication Status"
        unique_id: youems_inverter_communication_status
        icon: mdi:lan-connect
        state: >
          {% set native = states('sensor.solinteg_inverter_communication_health') | lower %}
          {% set recovering = state_attr('sensor.solinteg_inverter_communication_health', 'recovering') == true %}
          {% if is_state('input_boolean.youems_inverter_communication_fault', 'on') %}
            Fault
          {% elif native == 'offline' %}
            Offline
          {% elif native == 'quarantined' %}
            Quarantined
          {% elif native == 'degraded' %}
            Degraded
          {% elif native == 'unknown' %}
            Unknown
          {% elif native == 'unavailable' %}
            Unavailable
          {% elif recovering %}
            Recovering
          {% else %}
            Healthy
          {% endif %}
        attributes:
          fault_threshold_seconds: 120
          alert_threshold_seconds: 180
          recovery_confirmation_seconds: 60
          startup_grace_seconds: 120
          detection_rule: "hard fault after >120 s native SolaX Offline, or >=2/3 core power heartbeats, or >=3 secondary Modbus signals stale/invalid; native Degraded/Quarantined/unknown/unavailable is advisory when telemetry remains fresh"
          native_solax_health: "{{ states('sensor.solinteg_inverter_communication_health') }}"
          native_solax_success_rate: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'success_rate') }}"
          native_solax_recovering: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'recovering') }}"
          native_solax_advisory_degraded: >
            {% set h = states('sensor.solinteg_inverter_communication_health') | lower %}
            {{ h in ['degraded', 'quarantined', 'unknown', 'unavailable']
               or state_attr('sensor.solinteg_inverter_communication_health', 'recovering') == true }}
          native_solax_quarantined_registers: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'quarantined_registers') }}"
          native_solax_last_quarantined_register: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'last_quarantined_register') }}"
          native_solax_last_recovered_register: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'last_recovered_register') }}"
          native_solax_hard_offline: >
            {{ states('sensor.solinteg_inverter_communication_health') | lower == 'offline' }}
          native_solax_last_error: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'last_error') }}"
          native_solax_last_error_time: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'last_error_time') }}"
          native_solax_last_block_failure_age_seconds: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'last_block_failure_age_seconds') }}"
          native_solax_average_poll_duration_ms: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'average_poll_duration_ms') }}"
          native_solax_max_poll_duration_ms: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'max_poll_duration_ms') }}"
          native_solax_overrun_count: "{{ state_attr('sensor.solinteg_inverter_communication_health', 'overrun_count') }}"
          core_entities: "grid power, battery power, PV power"
          grid_age_seconds: >
            {% set s = states.sensor.solax_inverter_meter_active_power %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          battery_power_age_seconds: >
            {% set s = states.sensor.solax_inverter_battery_power %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          pv_power_age_seconds: >
            {% set s = states.sensor.solax_inverter_pv_power_total %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          battery_soc_age_seconds: >
            {% set s = states.sensor.solax_inverter_battery_soc %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          battery_voltage_age_seconds: >
            {% set s = states.sensor.solax_inverter_battery_voltage %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          charge_limit_age_seconds: >
            {% set s = states.sensor.solax_inverter_battery_charge_limit %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          discharge_limit_age_seconds: >
            {% set s = states.sensor.solax_inverter_battery_discharge_limit %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          operation_flags_age_seconds: >
            {% set s = states.sensor.solax_inverter_inverter_operation_flags %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          working_mode_age_seconds: >
            {% set s = states.select.solax_inverter_working_mode %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          ems_output_limit_age_seconds: >
            {% set s = states.number.solinteg_inverter_solax_inverter_ems_battctrl_max_ac_power_limit %}
            {% set t = s.last_reported if s is not none and s.last_reported is defined else (s.last_updated if s is not none else none) %}
            {{ (as_timestamp(now()) - as_timestamp(t, 0)) | round(1) if t is not none else 999999 }}
          fault_started: "{{ states('input_datetime.youems_inverter_communication_fault_started') }}"
          last_recovery: "{{ states('input_datetime.youems_inverter_communication_last_recovery') }}"
          last_event: "{{ states('input_text.youems_inverter_communication_last_event') }}"
          last_forced_action: "{{ states('input_text.youems_inverter_communication_last_forced_action') }}"
          schedule_fallback_active: "{{ is_state('input_boolean.youems_inverter_communication_schedule_fallback_active', 'on') }}"

      - name: "YOUEMS PV Availability"
        unique_id: youems_pv_availability
        unit_of_measurement: "%"
        icon: mdi:solar-panel
        state: >
          {% set samples = states('input_number.youems_pv_availability_samples') | int(0) %}
          {% set learned_raw = states('input_number.youems_pv_availability_learned_pct') %}
          {% set learned = learned_raw | float(100) if samples > 0 and is_number(learned_raw) else 100 %}
          {{ ([[learned, 0] | max, 100] | min) | round(1) }}
        attributes:
          enabled: "{{ is_state('input_boolean.youems_pv_forecast_adaptation_enabled', 'on') }}"
          learned_factor_pct: >
            {% set samples = states('input_number.youems_pv_availability_samples') | int(0) %}
            {% set learned_raw = states('input_number.youems_pv_availability_learned_pct') %}
            {{ ([[learned_raw | float(100) if samples > 0 and is_number(learned_raw) else 100, 0] | max, 100] | min) | round(1) }}
          applied_factor_pct: >
            {{ (states('sensor.youems_pv_availability') | float(100) | round(1))
               if is_state('input_boolean.youems_pv_forecast_adaptation_enabled', 'on')
               else 100.0 }}
          effective_factor_pct: >
            {{ (states('sensor.youems_pv_availability') | float(100) | round(1))
               if is_state('input_boolean.youems_pv_forecast_adaptation_enabled', 'on')
               else 100.0 }}
          accepted_updates: "{{ states('input_number.youems_pv_availability_samples') | int(0) }}"
          shortfall_response_pct: "{{ states('input_number.youems_pv_shortfall_response_pct') | float(50) | round(0) }}"
          recovery_response_pct: "{{ states('input_number.youems_pv_recovery_response_pct') | float(40) | round(0) }}"
          last_observed_pct: "{{ states('input_number.youems_pv_availability_last_observed_pct') | float(0) | round(1) }}"
          last_update: "{{ states('input_text.youems_pv_availability_last_update') }}"
          learning_window: "completed Solcast 30-minute periods"
          minimum_p50_energy_kwh: 0.25
          full_learning_weight_p50_kwh: 3.0
          energy_weight_rule: "shortfall response is scaled by expected P50 energy / 3.0 kWh, capped at 100%; recovery is not energy-weighted"
          application_rule: "learning always runs; PV Forecast Adaptation controls whether the learned factor is applied to planning"
          downward_gate: "actual energy below Solcast P10 energy"
          observation_deadband_pct_points: 2
          curtailment_guard: "skip whole period if PV PLim, or EMS CmdLim while 50208 is restrictive"
          operation_flags: "{{ states('sensor.solax_inverter_inverter_operation_flags') }}"
          operation_flags_source: "sensor.solax_inverter_inverter_operation_flags"
          no_flags_state: "empty string is valid and means no operation flags active"

      - name: "YOUEMS PV Availability Status"
        unique_id: youems_pv_availability_status
        icon: mdi:solar-panel-large
        state: >
          {% set enabled = is_state('input_boolean.youems_pv_forecast_adaptation_enabled', 'on') %}
          {% set samples = states('input_number.youems_pv_availability_samples') | int(0) %}
          {% set factor = states('sensor.youems_pv_availability') | float(100) %}
          {% if not enabled %}
            Disabled — tracking {{ factor | round(0) | int }}%, planner uses 100%
          {% elif samples <= 0 %}
            Learning — trusting Solcast
          {% elif factor >= 90 %}
            Normal
          {% elif factor >= 60 %}
            Mildly reduced
          {% elif factor >= 30 %}
            Reduced
          {% else %}
            Severely restricted
          {% endif %}
        attributes:
          effective_factor_pct: "{{ state_attr('sensor.youems_pv_availability', 'effective_factor_pct') }}"
          learned_factor_pct: "{{ states('sensor.youems_pv_availability') | float(100) | round(1) }}"
          application_enabled: "{{ is_state('input_boolean.youems_pv_forecast_adaptation_enabled', 'on') }}"
          last_update: "{{ states('input_text.youems_pv_availability_last_update') }}"

      - name: "YOUEMS Shadow Battery Remaining Capacity"
        unique_id: youems_shadow_battery_remaining_capacity
        unit_of_measurement: "kWh"
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-sync
        availability: >
          {% set initialized = is_state('input_boolean.youems_shadow_soc_initialized', 'on') %}
          {% set fine_initialized = is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') %}
          {% set charge_raw = states('sensor.solax_inverter_battery_charge_total') %}
          {% set discharge_raw = states('sensor.solax_inverter_battery_discharge_total') %}
          {% set anchor_soc = states('input_number.youems_shadow_anchor_soc_pct') | float(0) %}
          {% set anchor_kwh = states('input_number.youems_shadow_anchor_battery_kwh') | float(0) %}
          {% set anchor_charge = states('input_number.youems_shadow_anchor_charge_total_kwh') | float(0) %}
          {% set anchor_discharge = states('input_number.youems_shadow_anchor_discharge_total_kwh') | float(0) %}
          {% set coarse_valid = is_number(charge_raw) and is_number(discharge_raw)
             and charge_raw | float(0) + 0.05 >= anchor_charge
             and discharge_raw | float(0) + 0.05 >= anchor_discharge %}
          {{ initialized
             and not is_state('input_boolean.youems_shadow_anchor_update_in_progress', 'on')
             and anchor_soc > 0 and anchor_kwh > 0
             and (fine_initialized or coarse_valid) }}
        state: >
          {% set anchor_kwh = states('input_number.youems_shadow_anchor_battery_kwh') | float(0) %}
          {% set fine_initialized = is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') %}
          {% set charge_loss_pct = states('sensor.youems_charge_loss') | float(2.5) %}
          {% set charge_factor = 1 - ([[charge_loss_pct, 0] | max, 5] | min) / 100 %}
          {% if fine_initialized %}
            {% set charged_measured = states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0) %}
            {% set discharged = states('input_number.youems_shadow_fine_discharge_since_anchor_kwh') | float(0) %}
          {% else %}
            {% set charged_measured = [states('sensor.solax_inverter_battery_charge_total') | float(0)
               - states('input_number.youems_shadow_anchor_charge_total_kwh') | float(0), 0] | max %}
            {% set discharged = [states('sensor.solax_inverter_battery_discharge_total') | float(0)
               - states('input_number.youems_shadow_anchor_discharge_total_kwh') | float(0), 0] | max %}
          {% endif %}
          {% set charged_stored = charged_measured * charge_factor %}
          {% set estimate = anchor_kwh + charged_stored - discharged %}
          {# Intentionally unbounded for diagnostics. Charge energy is corrected
             by the separate Shadow charge-loss setting before it is treated as
             stored battery energy. The high-resolution daily counters are stitched
             across their daily reset; coarse lifetime counters remain the
             restart/recovery fallback. #}
          {{ estimate | round(4) }}
        attributes:
          unbounded_debug_value: true
          counter_source: >
            {{ 'stitched high-resolution daily counters'
               if is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on')
               else 'coarse lifetime counters' }}
          safe_remaining_capacity_kwh: >
            {% set anchor_soc = states('input_number.youems_shadow_anchor_soc_pct') | float(0) %}
            {% set anchor_kwh = states('input_number.youems_shadow_anchor_battery_kwh') | float(0) %}
            {% set capacity = anchor_kwh * 100 / anchor_soc if anchor_soc > 0 else 0 %}
            {% set raw = states('sensor.youems_shadow_battery_remaining_capacity') | float(0) %}
            {{ ([[raw, 0] | max, capacity] | min if capacity > 0 else [raw, 0] | max) | round(4) }}
          anchor_type: "{{ states('input_text.youems_shadow_anchor_type') }}"
          anchor_time: "{{ states('input_text.youems_shadow_anchor_time') }}"
          anchor_soc_pct: "{{ states('input_number.youems_shadow_anchor_soc_pct') | float(0) | round(2) }}"
          anchor_battery_kwh: "{{ states('input_number.youems_shadow_anchor_battery_kwh') | float(0) | round(2) }}"
          inferred_capacity_kwh: >
            {% set anchor_soc = states('input_number.youems_shadow_anchor_soc_pct') | float(0) %}
            {% set anchor_kwh = states('input_number.youems_shadow_anchor_battery_kwh') | float(0) %}
            {{ (anchor_kwh * 100 / anchor_soc if anchor_soc > 0 else 0) | round(4) }}
          charge_loss_pct: "{{ states('sensor.youems_charge_loss') | float(2.5) | round(3) }}"
          charge_storage_factor: >
            {% set loss = states('sensor.youems_charge_loss') | float(2.5) %}
            {{ (1 - ([[loss, 0] | max, 5] | min) / 100) | round(4) }}
          charged_since_anchor_kwh: >
            {% if is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') %}
              {{ states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0) | round(4) }}
            {% else %}
              {{ ([states('sensor.solax_inverter_battery_charge_total') | float(0)
                   - states('input_number.youems_shadow_anchor_charge_total_kwh') | float(0), 0] | max) | round(1) }}
            {% endif %}
          effective_charged_since_anchor_kwh: >
            {% set loss = states('sensor.youems_charge_loss') | float(2.5) %}
            {% set factor = 1 - ([[loss, 0] | max, 5] | min) / 100 %}
            {% if is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') %}
              {% set measured = states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0) %}
            {% else %}
              {% set measured = [states('sensor.solax_inverter_battery_charge_total') | float(0)
                   - states('input_number.youems_shadow_anchor_charge_total_kwh') | float(0), 0] | max %}
            {% endif %}
            {{ (measured * factor) | round(4) }}
          discharged_since_anchor_kwh: >
            {% if is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') %}
              {{ states('input_number.youems_shadow_fine_discharge_since_anchor_kwh') | float(0) | round(4) }}
            {% else %}
              {{ ([states('sensor.solax_inverter_battery_discharge_total') | float(0)
                   - states('input_number.youems_shadow_anchor_discharge_total_kwh') | float(0), 0] | max) | round(1) }}
            {% endif %}
          net_change_since_anchor_kwh: >
            {% set loss = states('sensor.youems_charge_loss') | float(2.5) %}
            {% set factor = 1 - ([[loss, 0] | max, 5] | min) / 100 %}
            {% if is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') %}
              {% set charged = states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0) * factor %}
              {% set discharged = states('input_number.youems_shadow_fine_discharge_since_anchor_kwh') | float(0) %}
              {{ (charged - discharged) | round(4) }}
            {% else %}
              {% set charged = [states('sensor.solax_inverter_battery_charge_total') | float(0)
                 - states('input_number.youems_shadow_anchor_charge_total_kwh') | float(0), 0] | max * factor %}
              {% set discharged = [states('sensor.solax_inverter_battery_discharge_total') | float(0)
                 - states('input_number.youems_shadow_anchor_discharge_total_kwh') | float(0), 0] | max %}
              {{ (charged - discharged) | round(4) }}
            {% endif %}
          fine_charge_today_kwh: "{{ states('sensor.force_h3_today_battery_charge') }}"
          fine_discharge_today_kwh: "{{ states('sensor.force_h3_today_battery_discharge') }}"
          fine_charge_reset_pending: "{{ is_state('input_boolean.youems_shadow_fine_charge_reset_pending', 'on') }}"
          fine_discharge_reset_pending: "{{ is_state('input_boolean.youems_shadow_fine_discharge_reset_pending', 'on') }}"
          full_sync_armed: "{{ is_state('input_boolean.youems_shadow_full_sync_armed', 'on') }}"
          full_sync_arm_charge_kwh: "{{ states('input_number.youems_shadow_full_sync_arm_charge_kwh') | float(0) | round(4) }}"
          full_sync_charge_since_arm_kwh: >
            {{ ([states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0)
                 - states('input_number.youems_shadow_full_sync_arm_charge_kwh') | float(0), 0] | max) | round(4) }}
          fine_last_event: "{{ states('input_text.youems_shadow_fine_last_event') }}"

      - name: "YOUEMS Shadow Battery SOC"
        unique_id: youems_shadow_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery-sync
        availability: "{{ states('sensor.youems_shadow_battery_remaining_capacity') not in ['unknown', 'unavailable', 'none', ''] }}"
        state: >
          {% set anchor_soc = states('input_number.youems_shadow_anchor_soc_pct') | float(0) %}
          {% set anchor_kwh = states('input_number.youems_shadow_anchor_battery_kwh') | float(0) %}
          {% set capacity = anchor_kwh * 100 / anchor_soc if anchor_soc > 0 else 0 %}
          {% set fine_initialized = is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') %}
          {% set charge_loss_pct = states('sensor.youems_charge_loss') | float(2.5) %}
          {% set charge_factor = 1 - ([[charge_loss_pct, 0] | max, 5] | min) / 100 %}
          {% if fine_initialized %}
            {% set charged_measured = states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0) %}
            {% set discharged = states('input_number.youems_shadow_fine_discharge_since_anchor_kwh') | float(0) %}
          {% else %}
            {% set charged_measured = [states('sensor.solax_inverter_battery_charge_total') | float(0)
               - states('input_number.youems_shadow_anchor_charge_total_kwh') | float(0), 0] | max %}
            {% set discharged = [states('sensor.solax_inverter_battery_discharge_total') | float(0)
               - states('input_number.youems_shadow_anchor_discharge_total_kwh') | float(0), 0] | max %}
          {% endif %}
          {% set energy = anchor_kwh + charged_measured * charge_factor - discharged %}
          {# Intentionally unbounded for diagnostics. Calculate directly from the
             unrounded anchor and stitched movement values, applying only the
             dedicated Shadow charge-loss correction to measured charge energy. #}
          {{ (energy * 100 / capacity if capacity > 0 else 0) | round(3) }}
        attributes:
          status: "{{ states('sensor.youems_shadow_soc_status') }}"
          unbounded_debug_value: true
          counter_source: >
            {{ 'stitched high-resolution daily counters'
               if is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on')
               else 'coarse lifetime counters' }}
          charge_loss_pct: "{{ states('sensor.youems_charge_loss') | float(2.5) | round(3) }}"
          safe_soc_pct: >
            {% set raw = states('sensor.youems_shadow_battery_soc') | float(0) %}
            {{ ([[raw, 0] | max, 100] | min) | round(3) }}
          bms_soc_pct: "{{ states('sensor.force_h3_battery_percent') | float(0) | round(2) }}"
          difference_from_bms_pct: >
            {{ (states('sensor.youems_shadow_battery_soc') | float(0)
                - states('sensor.force_h3_battery_percent') | float(0)) | round(3) }}
          bms_remaining_capacity_kwh: "{{ states('sensor.force_h3_battery_remaining_capacity') | float(0) | round(2) }}"
          difference_from_bms_kwh: >
            {{ (states('sensor.youems_shadow_battery_remaining_capacity') | float(0)
                - states('sensor.force_h3_battery_remaining_capacity') | float(0)) | round(4) }}

      - name: "YOUEMS Operational Shadow SOC"
        unique_id: youems_operational_shadow_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery-heart-variant
        availability: >
          {{ is_number(states('sensor.youems_shadow_battery_soc'))
             and is_state('input_boolean.youems_shadow_soc_initialized', 'on')
             and not is_state('input_boolean.youems_shadow_anchor_update_in_progress', 'on') }}
        state: >
          {% set raw = states('sensor.youems_shadow_battery_soc') | float(0) %}
          {% set correction = states('input_number.youems_shadow_top_correction_pct') | float(0) %}
          {# Raw Shadow SOC remains deliberately unbounded for calibration. The
             operational value subtracts any top-end overshoot latched when real
             discharge starts, then enforces the physical 0..100% range. This
             preserves every later discharge percentage point instead of creating
             a dead zone while raw SOC falls from an overshoot back to 100%. #}
          {{ [[raw - correction, 0] | max, 100] | min | round(3) }}
        attributes:
          raw_shadow_soc_pct: "{{ states('sensor.youems_shadow_battery_soc') | float(0) | round(3) }}"
          top_correction_pct: "{{ states('input_number.youems_shadow_top_correction_pct') | float(0) | round(3) }}"
          top_correction_time: "{{ states('input_text.youems_shadow_top_correction_time') }}"
          last_pre_full_raw_soc_pct: "{{ states('input_number.youems_shadow_last_pre_full_raw_soc_pct') | float(0) | round(3) }}"
          last_full_error_pct: >
            {{ (states('input_number.youems_shadow_last_pre_full_raw_soc_pct') | float(100) - 100) | round(3) }}
          raw_is_unbounded: true
          planner_source: true

      - name: "YOUEMS Shadow SOC Status"
        unique_id: youems_shadow_soc_status
        icon: mdi:battery-sync-outline
        state: >
          {% set initialized = is_state('input_boolean.youems_shadow_soc_initialized', 'on') %}
          {% set fine_initialized = is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') %}
          {% set charge_raw = states('sensor.solax_inverter_battery_charge_total') %}
          {% set discharge_raw = states('sensor.solax_inverter_battery_discharge_total') %}
          {% set anchor_charge = states('input_number.youems_shadow_anchor_charge_total_kwh') | float(0) %}
          {% set anchor_discharge = states('input_number.youems_shadow_anchor_discharge_total_kwh') | float(0) %}
          {% if is_state('input_boolean.youems_shadow_anchor_update_in_progress', 'on') %}
            Updating Shadow SOC anchor
          {% elif not initialized %}
            Awaiting full-limit sync or manual re-sync
          {% elif fine_initialized %}
            Tracking from {{ states('input_text.youems_shadow_anchor_type') }} anchor — high-resolution counters
          {% elif not is_number(charge_raw) or not is_number(discharge_raw) %}
            Waiting for battery energy counters
          {% elif charge_raw | float(0) + 0.05 < anchor_charge or discharge_raw | float(0) + 0.05 < anchor_discharge %}
            Counter reset detected — awaiting full or manual sync
          {% else %}
            Tracking from {{ states('input_text.youems_shadow_anchor_type') }} anchor — coarse fallback
          {% endif %}
        attributes:
          raw_shadow_observational_only: true
          planner_uses_shadow_soc: true
          planner_soc_sensor: "sensor.youems_operational_shadow_soc"
          operational_top_correction_pct: "{{ states('input_number.youems_shadow_top_correction_pct') | float(0) | round(3) }}"
          operational_top_correction_time: "{{ states('input_text.youems_shadow_top_correction_time') }}"
          last_pre_full_raw_soc_pct: "{{ states('input_number.youems_shadow_last_pre_full_raw_soc_pct') | float(0) | round(3) }}"
          last_full_error_pct: >
            {{ (states('input_number.youems_shadow_last_pre_full_raw_soc_pct') | float(100) - 100) | round(3) }}
          anchor_update_in_progress: "{{ is_state('input_boolean.youems_shadow_anchor_update_in_progress', 'on') }}"
          automatic_sync_method: "Charge direction + cumulative-energy movement + BMS charge-limit transition from allowed to zero; qualifying full-to-full cycles also learn Charge Loss"
          automatic_empty_sync_enabled: false
          low_limit_event_diagnostic_only: true
          shadow_counter_method: "Stitched Force H3 daily charge/discharge counters; Solinteg lifetime counters used only for restart/recovery diagnostics"
          shadow_charge_loss_pct: "{{ states('sensor.youems_charge_loss') | float(2.5) | round(3) }}"
          shadow_charge_loss_applies_to: "Automatically learned full-to-full; applied to measured/predicted charge energy only; discharge energy is unchanged"
          daily_reset_confirmation_seconds: 20
          coarse_drift_warning_kwh: 0.75
          coarse_charge_drift_kwh: >
            {% set coarse = [states('sensor.solax_inverter_battery_charge_total') | float(0)
                             - states('input_number.youems_shadow_anchor_charge_total_kwh') | float(0), 0] | max %}
            {{ (states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0) - coarse) | round(4) }}
          coarse_discharge_drift_kwh: >
            {% set coarse = [states('sensor.solax_inverter_battery_discharge_total') | float(0)
                             - states('input_number.youems_shadow_anchor_discharge_total_kwh') | float(0), 0] | max %}
            {{ (states('input_number.youems_shadow_fine_discharge_since_anchor_kwh') | float(0) - coarse) | round(4) }}
          fine_counter_initialized: "{{ is_state('input_boolean.youems_shadow_fine_counter_initialized', 'on') }}"
          fine_charge_since_anchor_kwh: "{{ states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0) | round(4) }}"
          fine_discharge_since_anchor_kwh: "{{ states('input_number.youems_shadow_fine_discharge_since_anchor_kwh') | float(0) | round(4) }}"
          fine_charge_today_kwh: "{{ states('sensor.force_h3_today_battery_charge') }}"
          fine_discharge_today_kwh: "{{ states('sensor.force_h3_today_battery_discharge') }}"
          fine_last_charge_today_kwh: "{{ states('input_number.youems_shadow_fine_last_today_charge_kwh') | float(0) | round(4) }}"
          fine_last_discharge_today_kwh: "{{ states('input_number.youems_shadow_fine_last_today_discharge_kwh') | float(0) | round(4) }}"
          fine_charge_reset_pending: "{{ is_state('input_boolean.youems_shadow_fine_charge_reset_pending', 'on') }}"
          fine_discharge_reset_pending: "{{ is_state('input_boolean.youems_shadow_fine_discharge_reset_pending', 'on') }}"
          full_sync_armed: "{{ is_state('input_boolean.youems_shadow_full_sync_armed', 'on') }}"
          full_sync_arm_charge_kwh: "{{ states('input_number.youems_shadow_full_sync_arm_charge_kwh') | float(0) | round(4) }}"
          full_sync_charge_since_arm_kwh: >
            {{ ([states('input_number.youems_shadow_fine_charge_since_anchor_kwh') | float(0)
                 - states('input_number.youems_shadow_full_sync_arm_charge_kwh') | float(0), 0] | max) | round(4) }}
          fine_last_event: "{{ states('input_text.youems_shadow_fine_last_event') }}"
          battery_direction: "{{ states('sensor.solax_inverter_battery_charge_direction') }}"
          full_direction_required: charge
          full_soc_guard_pct: 95
          full_anchor_soc_pct: 100
          charge_limit_a: "{{ states('sensor.solax_inverter_battery_charge_limit') }}"
          discharge_limit_a: "{{ states('sensor.solax_inverter_battery_discharge_limit') }}"
          charge_total_kwh: "{{ states('sensor.solax_inverter_battery_charge_total') }}"
          discharge_total_kwh: "{{ states('sensor.solax_inverter_battery_discharge_total') }}"

      - name: "YOUEMS Learned Charge Acceptance Power"
        unique_id: youems_learned_charge_acceptance_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:battery-charging-medium
        availability: >
          {% set parts = states('input_text.youems_charge_curve_deci_kw').split(',') %}
          {% set operational = states('sensor.youems_operational_shadow_soc') %}
          {{ parts | length == 38 and is_number(operational) }}
        state: >
          {% set parts = states('input_text.youems_charge_curve_deci_kw').split(',') %}
          {% set soc = states('sensor.youems_operational_shadow_soc') | float(0) %}
          {% if soc < 62 %}
            {% set idx = [[(((soc - 10) / 5) | round(0, 'floor') | int), 0] | max, 10] | min %}
          {% elif soc < 85 %}
            {% set idx = [11 + (((soc - 62) / 2) | round(0, 'floor') | int), 22] | min %}
          {% else %}
            {% set idx = [[23 + ((soc - 85) | round(0, 'floor') | int), 23] | max, 37] | min %}
          {% endif %}
          {% set exact = parts[idx] | int(0) / 10 if parts | length == 38 else 0 %}
          {% if exact > 0 %}
            {{ exact | round(1) }}
          {% else %}
            {# Diagnostic fallback only. Planner prediction itself treats an unlearned
               bucket as unrestricted and accepts the full requested/available power. #}
            {{ states('sensor.qems_bms_approx_max_charge_power') | float(0) | round(1) }}
          {% endif %}
        attributes:
          soc_source: "Operational Shadow SOC"
          soc_pct: "{{ states('sensor.youems_operational_shadow_soc') | float(0) | round(2) }}"
          bucket_layout: "10-60%: 5%-spaced starts; 60-85%: 2%-spaced starts; 85-100%: 1% buckets"
          bucket_count: 38
          current_bucket_start_pct: >
            {% set soc = states('sensor.youems_operational_shadow_soc') | float(0) %}
            {% if soc < 62 %}
              {% set idx = [[(((soc - 10) / 5) | round(0, 'floor') | int), 0] | max, 10] | min %}
            {% elif soc < 85 %}
              {% set idx = [11 + (((soc - 62) / 2) | round(0, 'floor') | int), 22] | min %}
            {% else %}
              {% set idx = [[23 + ((soc - 85) | round(0, 'floor') | int), 23] | max, 37] | min %}
            {% endif %}
            {{ (10 + idx * 5) if idx <= 10 else ((62 + (idx - 11) * 2) if idx <= 22 else (85 + idx - 23)) }}
          current_bucket_learned: >
            {% set parts = states('input_text.youems_charge_curve_deci_kw').split(',') %}
            {% set soc = states('sensor.youems_operational_shadow_soc') | float(0) %}
            {% if soc < 62 %}
              {% set idx = [[(((soc - 10) / 5) | round(0, 'floor') | int), 0] | max, 10] | min %}
            {% elif soc < 85 %}
              {% set idx = [11 + (((soc - 62) / 2) | round(0, 'floor') | int), 22] | min %}
            {% else %}
              {% set idx = [[23 + ((soc - 85) | round(0, 'floor') | int), 23] | max, 37] | min %}
            {% endif %}
            {{ parts | length == 38 and parts[idx] | int(0) > 0 }}
          unlearned_prediction_policy: "full requested/available power"
          live_bms_limit_kw: "{{ states('sensor.qems_bms_approx_max_charge_power') | float(0) | round(2) }}"
          battery_direction: "{{ states('sensor.solax_inverter_battery_charge_direction') }}"
          learning_direction_valid: "{{ states('sensor.solax_inverter_battery_charge_direction') | lower == 'charge' }}"
          learning_soc_source: "Operational Shadow SOC only"

      - name: "YOUEMS Charge Acceptance Curve"
        unique_id: youems_charge_acceptance_curve
        icon: mdi:chart-bell-curve-cumulative
        state: >
          {% set parts = states('input_text.youems_charge_curve_deci_kw').split(',') %}
          {% set ns = namespace(n=0) %}
          {% if parts | length == 38 %}
            {% for v in parts %}{% if v | int(0) > 0 %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
          {% endif %}
          {{ ns.n }}/38 buckets
        attributes:
          bucket_start_soc_pct: 10
          bucket_count: 38
          bucket_end_soc_pct: 99
          bucket_layout: "10,15,...,60; 62,64,...,84; 85,86,...,99"
          bucket_resolution: "5% below 60%; 2% from 60% to 85%; 1% from 85% to 100%"
          storage_format: "38 comma-separated integer deci-kW values; maximum 151 of input_text's 255 characters"
          learning_policy: "Operational Shadow SOC only; qualified deep-charge session armed at <=50%; unlearned bucket initializes from first sample; learned bucket moves 45% toward a lower observation or 10% toward a higher observation; normally one accepted update per bucket/session, with another allowed only after BMS charge-limit current changes >=10% from the last accepted update in that bucket"
          learning_session_required: "Arm only while genuine charging at <=50% Operational Shadow SOC; once armed, learn upward until full or interruption"
          learning_session_armed: "{{ is_state('input_boolean.youems_charge_curve_deep_session', 'on') }}"
          learning_session_arm_max_soc_pct: 50
          learning_session_peak_soc_pct: "{{ states('input_number.youems_charge_curve_session_peak_soc') | float(0) | round(1) }}"
          learning_session_last_genuine_charge: "{{ states('input_datetime.youems_charge_curve_last_genuine_charge') }}"
          learning_session_abort_policy: "Disarm at >=99.9% SOC, >=1.0% drop from session peak, or >=5 minutes without genuine charging; HA restart also starts disarmed"
          curve_kw: >
            {% set parts = states('input_text.youems_charge_curve_deci_kw').split(',') %}
            {% set ns = namespace(v=[]) %}
            {% for i in range(38) %}
              {% set raw = parts[i] | int(0) if parts | length == 38 else 0 %}
              {% set ns.v = ns.v + [(raw / 10) if raw > 0 else 0] %}
            {% endfor %}
            {{ ns.v }}
          sample_counts: >
            {% set parts = states('input_text.youems_charge_curve_sample_counts').split(',') %}
            {% set ns = namespace(v=[]) %}
            {% for i in range(38) %}
              {% set ns.v = ns.v + [parts[i] | int(0) if parts | length == 38 else 0] %}
            {% endfor %}
            {{ ns.v }}
          soc_buckets_pct: >
            {{ [10,15,20,25,30,35,40,45,50,55,60,62,64,66,68,70,72,74,76,78,80,82,84,85,86,87,88,89,90,91,92,93,94,95,96,97,98,99] }}
          learned_buckets: >
            {% set parts = states('input_text.youems_charge_curve_deci_kw').split(',') %}
            {% set ns = namespace(n=0) %}
            {% if parts | length == 38 %}
              {% for v in parts %}{% if v | int(0) > 0 %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
            {% endif %}
            {{ ns.n }}
          total_samples: "{{ states('input_number.youems_charge_curve_learning_samples') | int(0) }}"
          last_update: "{{ states('input_text.youems_charge_curve_last_update') }}"
          currently_predicted_kw: "{{ states('sensor.youems_learned_charge_acceptance_power') }}"

      - name: "YOUEMS Savings This Month"
        unique_id: youems_savings_month
        unit_of_measurement: "Kr"
        icon: mdi:calendar-month
        state: "{{ states('input_number.youems_savings_month_kr') | float(0) | round(2) }}"

      - name: "YOUEMS Savings Last Month"
        unique_id: youems_savings_last_month
        unit_of_measurement: "Kr"
        icon: mdi:calendar-month-outline
        state: "{{ states('input_number.youems_savings_last_month_kr') | float(0) | round(2) }}"

      - name: "YOUEMS Savings Today"
        unique_id: youems_savings_today
        unit_of_measurement: "Kr"
        icon: mdi:calendar-today
