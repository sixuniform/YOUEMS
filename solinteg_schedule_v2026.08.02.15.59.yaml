      - name: "qEMS Calculated House Load"
        unique_id: qems_calculated_house_load
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt-outline
        state: >
          {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
          {%- set batt = states('sensor.solax_inverter_battery_power') | float(0) / 1000 -%}
          {# Native Solax meter: positive = grid export, negative = grid import. #}
          {%- set grid = states('sensor.solax_inverter_meter_active_power') | float(0) / 1000 -%}
          {{ ([pv + batt - grid, 0] | max) | round(3) }}

      - name: "qEMS Inverter Output"
        unique_id: qems_inverter_output
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:home-export-outline
        state: >
          {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
          {%- set batt = states('sensor.solax_inverter_battery_power') | float(0) / 1000 -%}
          {{ (pv + batt) | round(3) }}

      - name: "qEMS Raw Target"
        unique_id: qems_raw_target
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:target
        state: >
          {%- set mode = states('input_text.qems_active_mode') -%}
          {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
          {%- set batt = states('sensor.solax_inverter_battery_power') | float(0) / 1000 -%}
          {# Native Solax meter: positive = grid export, negative = grid import. #}
          {%- set grid_raw = states('sensor.solax_inverter_meter_active_power') | float(0) / 1000 -%}
          {%- set deadband = states('input_number.qems_grid_deadband_kw') | float(0.01) -%}
          {%- set grid = 0 if (grid_raw | abs) < deadband else grid_raw -%}
          {%- set house = [pv + batt - grid, 0] | max -%}
          {%- set requested = states('input_number.qems_requested_power_kw') | float(0) -%}
          {%- set maximum = states('input_number.qems_max_target_kw') | float(10) -%}
          {# BattCtrl target is battery power: + discharge, - charge.
             With the native Solax grid sign (+ export / - import),
             current net demand after PV is battery - grid. #}
          {%- set net_after_pv = batt - grid -%}
          {%- if mode == 'qEMS Feed-In' -%}
            {%- set target = [net_after_pv, 0] | max -%}
          {%- elif mode == 'qEMS Self-Consumption' -%}
            {%- set target = net_after_pv -%}
          {%- elif mode == 'qEMS PV Charge' -%}
            {# Saturated charge request. Inverter import is hard-limited to 0 kW,
               while output is effectively unlimited at +200 kW, so available PV can
               charge the battery without chasing a moving PV sensor and excess PV may export. #}
            {%- set target = -maximum -%}
          {%- elif mode == 'qEMS PV Charge+House' -%}
            {# Charge only with the measured PV surplus. Export remains unlimited,
               so excess PV can still leave the site when the battery is full or limited. #}
            {%- set target = [net_after_pv, 0] | min -%}
          {%- elif mode == 'qEMS Battery Charge' -%}
            {%- set target = -requested -%}
          {%- elif mode == 'qEMS Battery Discharge' -%}
            {%- set target = [requested, net_after_pv, 0] | max -%}
          {%- elif mode == 'qEMS Battery Freeze' -%}
            {%- set target = 0 -%}
          {%- else -%}
            {%- set target = 0 -%}
          {%- endif -%}
          {{ ([[target, maximum] | min, -maximum] | max) | round(3) }}

      - name: "qEMS Desired Max Inverter Output"
        unique_id: qems_desired_max_inverter_output
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:transmission-tower-export
        state: >
          {%- set mode = states('input_text.qems_active_mode') -%}
          {# Observed firmware semantics: 0 kW is a real zero limit; +200 kW is
             effectively unlimited inverter output. qEMS Battery Freeze deliberately blocks output. #}
          {{ 0 if mode == 'qEMS Battery Freeze'
             else (200 if mode not in ['', 'Off', 'unknown', 'unavailable'] else 0) }}

      - name: "qEMS Desired Max Inverter Input"
        unique_id: qems_desired_max_inverter_input
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:transmission-tower-import
        state: >
          {%- set mode = states('input_text.qems_active_mode') -%}
          {# Observed firmware semantics: 0 kW blocks inverter import; -200 kW is
             effectively unlimited inverter input. #}
          {{ 0 if mode in ['qEMS Feed-In', 'qEMS Battery Discharge',
                           'qEMS PV Charge', 'qEMS PV Charge+House', 'qEMS Battery Freeze']
             else (-200 if mode in ['qEMS Self-Consumption', 'qEMS Battery Charge'] else 0) }}

      - name: "qEMS Expected Battery Power"
        unique_id: qems_expected_battery_power
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:battery-arrow-up-down
        state: >
          {%- set mode = states('input_text.qems_active_mode') -%}
          {%- if mode == 'qEMS PV Charge' -%}
            {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
            {%- set maximum = states('input_number.qems_max_target_kw') | float(10) -%}
            {%- set charge_allowed = states('sensor.force_h3_max_charging_current') | float(0) > 0.05 -%}
            {{ (-([pv, maximum] | min) if charge_allowed else 0) | round(3) }}
          {%- elif mode == 'qEMS PV Charge+House' -%}
            {%- set pv = states('sensor.solax_inverter_pv_power_total') | float(0) / 1000 -%}
            {%- set house = states('sensor.qems_calculated_house_load') | float(0) -%}
            {%- set maximum = states('input_number.qems_max_target_kw') | float(10) -%}
            {%- set charge_allowed = states('sensor.force_h3_max_charging_current') | float(0) > 0.05 -%}
            {%- set surplus = [[pv - house, maximum] | min, 0] | max -%}
            {{ (-surplus if charge_allowed else 0) | round(3) }}
          {%- elif mode in ['qEMS Feed-In', 'qEMS Self-Consumption',
                           'qEMS Battery Charge', 'qEMS Battery Discharge',
                           'qEMS Battery Freeze'] -%}
            {{ states('sensor.qems_raw_target') | float(0) | round(3) }}
          {%- else -%}
            0
          {%- endif -%}

      - name: "qEMS Target Error"
        unique_id: qems_target_error
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:delta
        state: >
          {{ (states('sensor.qems_expected_battery_power') | float(0)
              - (states('sensor.solax_inverter_battery_power') | float(0) / 1000)) | round(3) }}

      # Diagnostic-only estimates from the BMS-reported current permissions.
      # The inverter/BMS remains responsible for enforcing the real limits; qEMS
      # uses zero/non-zero current only as a directional permission gate.
      - name: "qEMS BMS Approx Max Charge Power"
        unique_id: qems_bms_approx_max_charge_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-down-outline
        state: >
          {%- set voltage_state = states('sensor.force_h3_battery_voltage') -%}
          {%- set current_state = states('sensor.force_h3_max_charging_current') -%}
          {%- if is_number(voltage_state) and is_number(current_state) -%}
            {%- set voltage = voltage_state | float(0) -%}
            {%- set current = [current_state | float(0), 0] | max -%}
            {{ (voltage * current / 1000) | round(2) }}
          {%- else -%}
            {{ none }}
          {%- endif -%}

      - name: "qEMS BMS Approx Max Discharge Power"
        unique_id: qems_bms_approx_max_discharge_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:battery-arrow-up-outline
        state: >
          {%- set voltage_state = states('sensor.force_h3_battery_voltage') -%}
          {%- set current_state = states('sensor.force_h3_max_discharging_current') -%}
          {%- if is_number(voltage_state) and is_number(current_state) -%}
            {%- set voltage = voltage_state | float(0) -%}
            {# Discharge permission is reported as a negative current. #}
            {%- set current = [-(current_state | float(0)), 0] | max -%}
            {{ (voltage * current / 1000) | round(2) }}
          {%- else -%}
            {{ none }}
          {%- endif -%}

