        state: >
          {% set t = states('input_select.schedule_01_type') %}
          {% set start = states('input_datetime.schedule_01_start') %}
          {% set end = states('input_datetime.schedule_01_end') %}
          {% set kw = states('input_number.schedule_01_power_kw') %}
