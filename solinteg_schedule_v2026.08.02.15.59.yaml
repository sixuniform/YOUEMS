          {%- set mode = states('select.solax_inverter_working_mode') -%}
          {%- set active = states('input_text.qems_active_mode') -%}
          {%- if mode == 'EMS BattCtrl'
                and is_state('input_boolean.qems_controller_enabled', 'on')
                and active not in ['', 'Off', 'unknown', 'unavailable'] -%}
            {{ active }}
          {%- elif mode == 'EMS General' -%}
            Self-Consumption
          {%- else -%}
