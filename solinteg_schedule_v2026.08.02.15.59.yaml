template:

  - sensor:
      - name: "YOUEMS Savings This Month"
        unique_id: youems_savings_month
        unit_of_measurement: "Kr"
        icon: mdi:calendar-month
        state: "{{ states('input_number.youems_savings_month_kr') | float(0) | round(2) }}"

      - name: "YOUEMS Savings Last Month"
        unique_id: youems_savings_last_month
        unit_of_measurement: "Kr"
        icon: mdi:calendar-month-outline
        state: "{{ states('input_number.youems_savings_last_month_kr') | float(0) | round(2) }}"

      - name: "YOUEMS Savings Today"
        unique_id: youems_savings_today
        unit_of_measurement: "Kr"
        icon: mdi:calendar-today
        state: "{{ states('input_number.youems_savings_today_kr') | float(0) | round(2) }}"

      - name: "YOUEMS Savings Yesterday"
        unique_id: youems_savings_yesterday
        unit_of_measurement: "Kr"
        icon: mdi:calendar-minus
        state: "{{ states('input_number.youems_savings_yesterday_kr') | float(0) | round(2) }}"

      - name: "YOUEMS Savings Total"
        unique_id: youems_savings_total
        unit_of_measurement: "Kr"
        icon: mdi:piggy-bank
        state: "{{ states('input_number.youems_savings_total_kr') | float(0) | round(2) }}"

      - name: "Auto Charge Locked Power"
        icon: mdi:lightning-bolt
        state: "{{ states('input_number.auto_charge_power_kw') | float | round(1) }} kW"
      - name: "Auto Charge Locked Target"
        icon: mdi:battery-charging
        state: "{{ states('input_number.auto_charge_target_kwh') | float | round(1) }} kWh"
      - name: "Auto Charge Locked Lookahead"
        icon: mdi:clock-end
        state: "{{ '48' if is_state('input_boolean.auto_charge_prediction_enabled', 'on') else states('input_number.auto_charge_lookahead_hours') | float | round(0) | int }} h"
      - name: "Auto Charge Locked Min Spread"
        icon: mdi:arrow-expand-vertical
        state: "{{ states('input_number.auto_charge_min_spread') | float | round(0) | int }} Öre"
      - name: "Auto Charge Locked Minimum SOC"
        icon: mdi:battery-lock
        state: "{{ states('input_number.auto_charge_min_soc_pct') | float(20) | round(0) | int }} %"
      - name: "Auto Charge Locked Self-Consumption Hours"
        default_entity_id: sensor.auto_charge_locked_discharge_hours
        icon: mdi:home-battery-outline
        state: "{{ states('input_number.auto_discharge_hours') | float | round(2) }} h"
      - name: "Auto Charge Locked Late Tolerance"
        icon: mdi:clock-plus-outline
        state: "{{ states('input_number.auto_charge_late_tolerance') | float | round(0) | int }} Öre/kWh"
      - name: "Auto Charge Locked Overcharge"
        icon: mdi:battery-plus-variant
        state: "{{ states('input_number.auto_charge_overcharge_pct') | float | round(0) | int }} %"

      - name: "Auto Inverter Locked Power"
        icon: mdi:lightning-bolt
        state: "{{ states('input_number.auto_inverter_charge_power_kw') | float | round(1) }} kW"
      - name: "Auto Inverter Locked Target"
        icon: mdi:battery-charging
        state: "{{ states('input_number.auto_inverter_target_kwh') | float | round(1) }} kWh"
      - name: "Auto Inverter Locked Lookahead"
        icon: mdi:clock-end
        state: "{{ '48' if is_state('input_boolean.auto_inverter_prediction_enabled', 'on') else states('input_number.auto_inverter_lookahead_hours') | float | round(0) | int }} h"
      - name: "Auto Inverter Locked Min Spread"
        icon: mdi:arrow-expand-vertical
        state: "{{ states('input_number.auto_inverter_min_spread') | float | round(0) | int }} Öre"
      - name: "Auto Inverter Locked Minimum SOC"
        icon: mdi:battery-lock
        state: "{{ states('input_number.auto_inverter_min_soc_pct') | float(20) | round(0) | int }} %"
      - name: "Auto Inverter Locked Self-Consumption Hours"
        default_entity_id: sensor.auto_inverter_locked_discharge_hours
        icon: mdi:home-battery-outline
        state: "{{ states('input_number.auto_inverter_discharge_hours') | float | round(2) }} h"
      - name: "Auto Inverter Locked Late Tolerance"
        icon: mdi:clock-plus-outline
        state: "{{ states('input_number.auto_inverter_late_tolerance') | float | round(0) | int }} Öre/kWh"
      - name: "Auto Inverter Locked Overcharge"
        icon: mdi:battery-plus-variant
        state: "{{ states('input_number.auto_inverter_overcharge_pct') | float | round(0) | int }} %"

      - name: "Auto Charge Locked Prediction"
        icon: mdi:brain
