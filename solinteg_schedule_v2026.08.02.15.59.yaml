            {% elif now_dt < s_dt %}
              {{ icon }} Upcoming · {{ start[0:10] }} {{ start[11:16] }}–{{ end[11:16] }}{% if t == 'qEMS Battery Charge' %} · {{ kw }} kW{% endif %}
            {% else %}
              {{ icon }} Past · {{ start[0:10] }} {{ start[11:16] }}–{{ end[11:16] }}
            {% endif %}
          {% endif %}

      - name: "Schedule 03 Summary"
        icon: mdi:calendar-clock
        state: >
          {% set t = states('input_select.schedule_03_type') %}
          {% set start = states('input_datetime.schedule_03_start') %}
          {% set end = states('input_datetime.schedule_03_end') %}
          {% set kw = states('input_number.schedule_03_power_kw') %}
          {% if start in ['unknown','unavailable'] %}
            Empty
          {% else %}
            {% set icon = '🔌' if t == 'qEMS Battery Charge' else ('🔋' if t == 'Self-Consumption' else ('🧊' if t == 'qEMS Battery Freeze' else ('🔌' if t == 'qEMS Battery Charge' else ('🔋➡️' if t == 'qEMS Battery Discharge' else ('⚡' if t == 'qEMS Feed-In' else '☀️'))))) %}
            {% set now_dt = now() %}
            {% set s_dt = start | as_datetime | as_local %}
