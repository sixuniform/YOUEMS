              {%- if ns.found == '' and is_state('input_boolean.schedule_' ~ s ~ '_enabled', 'on')
                    and states('input_datetime.schedule_' ~ s ~ '_start') not in ['unknown','unavailable','']
                    and states('input_datetime.schedule_' ~ s ~ '_start')[0:16] == now().strftime('%Y-%m-%d %H:%M') -%}
                {%- set ns.found = s -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.found }}
          post_behavior: >-
            {% set display = states('input_select.schedule_post_behavior') %}
            {{ {
              'Feed-In':'qEMS Feed-In',
              'Controlled Self-Consumption':'qEMS Self-Consumption',
              'PV Charge':'qEMS PV Charge',
              'PV Charge+House':'qEMS PV Charge+House',
              'Battery Charge':'qEMS Battery Charge',
              'Battery Discharge':'qEMS Battery Discharge',
              'Battery Freeze':'qEMS Battery Freeze'
            }.get(display, display) }}
          restore_mode: "{{ states('input_text.pre_schedule_working_mode') | default('EMS General') }}"
      - if:
          - condition: template
            value_template: "{{ next_slot != '' }}"
        then:
          - stop: Next schedule {{ next_slot }} starts now — direct handoff without post-behavior
      - action: input_text.set_value
        target:
          entity_id: input_text.active_schedule_slot
        data:
          value: ''
      - if:
          - condition: state
            entity_id: input_boolean.dry_run
            state: "off"
        then:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ post_behavior == 'Do Nothing' }}"
                sequence: []
              - conditions:
                  - condition: template
                    value_template: "{{ post_behavior == 'Restore Previous' }}"
                sequence:
                  - action: script.qems_stop
                    data:
                      restore_previous: false
                  - if:
                      - condition: template
                        value_template: "{{ restore_mode not in ['', 'unknown', 'unavailable'] and states('select.solax_inverter_working_mode') != restore_mode }}"
                    then:
                      - action: select.select_option
                        target:
                          entity_id: select.solax_inverter_working_mode
                        data:
                          option: '{{ restore_mode }}'
              - conditions:
                  - condition: template
                    value_template: "{{ post_behavior == 'Self-Consumption' }}"
                sequence:
                  - action: script.qems_stop
                    data:
                      restore_previous: false
                  - if:
                      - condition: template
                        value_template: "{{ states('select.solax_inverter_working_mode') != 'EMS General' }}"
                    then:
                      - action: select.select_option
                        target:
                          entity_id: select.solax_inverter_working_mode
                        data:
                          option: EMS General
              - conditions:
                  - condition: template
                    value_template: "{{ post_behavior in ['qEMS Battery Charge', 'qEMS Battery Discharge'] }}"
                sequence:
                  - action: script.qems_start
                    data:
                      mode: '{{ post_behavior }}'
                      requested_power_kw: 0
                      source: schedule
                      force_apply: false
              - conditions:
                  - condition: template
                    value_template: "{{ post_behavior in ['qEMS Feed-In', 'qEMS Self-Consumption', 'qEMS PV Charge', 'qEMS PV Charge+House', 'qEMS Battery Freeze'] }}"
                sequence:
                  - action: script.qems_start
                    data:
                      mode: '{{ post_behavior }}'
                      source: schedule
                      force_apply: false
        else:
          - action: persistent_notification.create
            data:
              title: 🧪 DRY RUN — Schedule Stop / Post-Behavior
              message: |
                Schedule ended. No inverter command was sent.
                Post-behavior: {{ post_behavior | replace('qEMS ', '') }}.
                {% if post_behavior == 'Restore Previous' %}
                Would stop qEMS and restore inverter working mode {{ restore_mode }}.
                {% elif post_behavior == 'Self-Consumption' %}
                Would stop qEMS and select EMS General.
                {% elif post_behavior in ['qEMS Battery Charge', 'qEMS Battery Discharge'] %}
                Would start {{ post_behavior | replace('qEMS ', '') }} at 0 kW.
                {% elif post_behavior == 'Do Nothing' %}
                Would leave the current controller/mode untouched.
                {% else %}
                Would start or continue {{ post_behavior | replace('qEMS ', '') }}; EMS parameters would only be initialized if the active sub-mode differs.
                {% endif %}
      - action: input_text.set_value
        target:
          entity_id: input_text.pre_schedule_working_mode
        data:
          value: ''
      - action: input_text.set_value
        target:
          entity_id: input_text.schedule_active_mode
        data:
          value: Unscheduled
    mode: single

  # ── SCHEDULE CANCELLED
  - id: schedule_cancelled
    alias: "Schedules - Cancelled Mid-Session"
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.schedule_01_enabled
          - input_boolean.schedule_02_enabled
          - input_boolean.schedule_03_enabled
          - input_boolean.schedule_04_enabled
          - input_boolean.schedule_05_enabled
          - input_boolean.schedule_06_enabled
          - input_boolean.schedule_07_enabled
          - input_boolean.schedule_08_enabled
          - input_boolean.schedule_09_enabled
          - input_boolean.schedule_10_enabled
          - input_boolean.schedule_11_enabled
          - input_boolean.schedule_12_enabled
          - input_boolean.schedule_13_enabled
          - input_boolean.schedule_14_enabled
          - input_boolean.schedule_15_enabled
          - input_boolean.schedule_16_enabled
          - input_boolean.schedule_17_enabled
          - input_boolean.schedule_18_enabled
          - input_boolean.schedule_19_enabled
          - input_boolean.schedule_20_enabled
          - input_boolean.schedule_21_enabled
          - input_boolean.schedule_22_enabled
          - input_boolean.schedule_23_enabled
          - input_boolean.schedule_24_enabled
          - input_boolean.schedule_25_enabled
          - input_boolean.schedule_26_enabled
          - input_boolean.schedule_27_enabled
          - input_boolean.schedule_28_enabled
          - input_boolean.schedule_29_enabled
          - input_boolean.schedule_30_enabled
          - input_boolean.schedule_31_enabled
          - input_boolean.schedule_32_enabled
          - input_boolean.schedule_33_enabled
          - input_boolean.schedule_34_enabled
          - input_boolean.schedule_35_enabled
          - input_boolean.schedule_36_enabled
          - input_boolean.schedule_37_enabled
          - input_boolean.schedule_38_enabled
          - input_boolean.schedule_39_enabled
