views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: custom:plotly-graph
            grid_options:
              columns: 48
            refresh_interval: 5
            entities:
              - entity: sensor.nordpool_kwh_se3_sek_0_200000_0
                tap_action:
                  action: none
                name: ""
                type: bar
                x: |
                  $fn ({hass}) => {
                    const attr = hass.states["sensor.nordpool_kwh_se3_sek_0_200000_0"].attributes;
                    return attr.raw_today.map((data) => data["start"]).concat(attr.tomorrow_valid ? attr.raw_tomorrow.map((data) => data["start"]) : []);
                  }
                "y": |
                  $fn ({hass}) => {
                    const attr = hass.states["sensor.nordpool_kwh_se3_sek_0_200000_0"].attributes;
                    return attr.raw_today.map((data) => data["value"]).concat(attr.tomorrow_valid ? attr.raw_tomorrow.map((data) => data["value"]) : []);
                  }
                marker:
                  color: |
                    $fn ({hass}) => {
                      const attr = hass.states["sensor.nordpool_kwh_se3_sek_0_200000_0"].attributes;
                      const values = attr.raw_today.map(d => d["value"]).concat(attr.tomorrow_valid ? attr.raw_tomorrow.map(d => d["value"]) : []);
                      const exportEnabled = hass.states['input_boolean.auto_export_limit_enabled']?.state === 'on';
                      const offThresh = parseFloat(hass.states['input_number.auto_export_limit_off_threshold']?.state || 0);
                      // Build fee-inclusive price array from the sensor the export limiter actually uses
                      // (nordpool_kwh_se3_sek_5_00_0 raw values * 100 = Öre with fee)
                      const feeAttr = hass.states['sensor.nordpool_kwh_se3_sek_5_00_0']?.attributes;
                      const feeValues = feeAttr ? (feeAttr.raw_today || []).map(d => d.value * 100)
                        .concat(feeAttr.tomorrow_valid ? (feeAttr.raw_tomorrow || []).map(d => d.value * 100) : []) : [];
                      return values.map((v, i) => {
                        const sellPrice = feeValues[i] !== undefined ? feeValues[i] : v * 1.05;
                        if (exportEnabled && sellPrice <= offThresh) {
                          return 'hsl(0, 100%, 50%)';
                        }
                        // 0 öre = dark green, ~150 = yellow, ~200 = orange, ~300 = red
                        const t = Math.min(Math.max(v / 300, 0), 1);
                        const hue = Math.round(120 * (1 - t));
                        const lightness = Math.round(18 + t * 32);
                        return `hsl(${hue}, 100%, ${lightness}%)`;
                      });
                    }
                hovertemplate: "%{y:.0f} Öre/kWh<extra></extra>"
              - entity: sensor.youems_operational_shadow_soc
                tap_action:
                  action: none
                name: pSOC
                type: scatter
                mode: lines
                yaxis: y2
                line:
                  color: rgba(255,255,255,0.7)
                  width: 1.5
                  dash: dot
                x: |
                  $fn ({hass}) => {
                    const now = new Date();
                    const capState = hass.states['sensor.solax_inverter_battery_rated_capacity']?.state;
                    const cap = parseFloat(capState) / 1000 || 20.4;
                    const socRaw = parseFloat(hass.states['sensor.youems_operational_shadow_soc']?.state || 50) / 100;
                    const dryRun = hass.states['input_boolean.dry_run']?.state === 'on';
                    const dryOffset = dryRun
                      ? parseFloat(hass.states['input_number.dry_run_battery_offset_pct']?.state || 0) / 100
                      : 0;
                    const soc0 = Math.min(Math.max(socRaw * (1 + dryOffset), 0), 1);
                    const curve = hass.states['sensor.youems_charge_acceptance_curve']?.attributes?.curve_kw || [];
                    const chargeBucketIndex = (pct) => {
                      let idx;
                      if (pct < 62) idx = Math.floor((pct - 10) / 5);
                      else if (pct < 85) idx = 11 + Math.floor((pct - 62) / 2);
                      else idx = 23 + Math.floor(pct - 85);
                      return Math.max(0, Math.min(37, idx));
                    };
                    const learnedAcceptance = (socKwh, requestedKw) => {
                      if (!Array.isArray(curve) || curve.length !== 38 || !Number.isFinite(requestedKw) || requestedKw <= 0) return Math.max(requestedKw || 0, 0);
                      const pct = cap > 0 ? socKwh / cap * 100 : 0;
                      const idx = chargeBucketIndex(pct);
                      const learned = parseFloat(curve[idx] || 0);
                      return learned > 0 ? Math.min(requestedKw, learned) : requestedKw;
                    };
                    const snap1 = parseFloat(hass.states['input_number.house_energy_snapshot_d1']?.state || 0);
                    const snap2 = parseFloat(hass.states['input_number.house_energy_snapshot_d2']?.state || 0);
                    const snap3 = parseFloat(hass.states['input_number.house_energy_snapshot_d3']?.state || 0);
                    const dy = Math.min(Math.max(snap1 - snap2, 0), 100);
                    const dd = Math.min(Math.max(snap2 - snap3, 0), 100);
                    const avgDaily = (dy > 0 && dd > 0) ? (dy + dd) / 2 : dy > 0 ? dy : 20;
                    // Use bias last written by schedule generation; fall back to active card value
                    const _scheduleBias = hass.states['input_number.schedule_forecast_bias']?.state;
                    const _invLocked = hass.states['input_boolean.auto_inverter_settings_locked']?.state === 'on';
                    const _cardBias = parseFloat(hass.states[_invLocked
                      ? 'input_number.auto_inverter_forecast_bias'
                      : 'input_number.auto_charge_forecast_bias']?.state || 0);
                    const forecastBias = (_scheduleBias && _scheduleBias !== 'unknown' && _scheduleBias !== 'unavailable')
                      ? parseFloat(_scheduleBias) / 100
                      : _cardBias / 100;
                    const drainFlat = avgDaily / 24; // raw kW fallback; forecast bias is applied once in getBandKw
                    // Band drain kW — delta between band boundaries, 2-day average
                    const snapVal = (key) => parseFloat(hass.states['input_number.house_snapshot_' + key]?.state || 0);
                    const getBandKw = (startKey, endKey) => {
                      // For each band, a "complete" window means both start and end snapshots
                      // have been captured in the same cycle day (d1 = today, d2 = yesterday).
                      // A snapshot's d1 is valid for a band only after the END snapshot fires.
                      // Before that, use d2 (yesterday's complete window).
                      const nowH = new Date().getHours();
                      let dt = 0, dy = 0;
                      // Band end hour: 06→6, 12→12, 18→18, 00→24(midnight)
                      const endHour = endKey === '00' ? 24 : endKey === '24' ? 24 : parseInt(endKey);
                      // Today's d1 window is complete only if current hour >= endHour
                      // d1 valid only if: period complete (end captured) AND positive delta
                      // startKey d1 being non-zero proves it was captured today (zeroed at midnight)
                      const d1Complete = nowH >= endHour
                                         && snapVal(startKey + '_d1') > 0
                                         && snapVal(endKey + '_d1') > snapVal(startKey + '_d1');
                      if (d1Complete) {
                        dt = Math.min(Math.max(snapVal(endKey + '_d1') - snapVal(startKey + '_d1'), 0), 30);
                      }
                      // d2 valid only if positive delta
                      const d2Valid = snapVal(startKey + '_d2') > 0
                                      && snapVal(endKey + '_d2') > snapVal(startKey + '_d2');
                      dy = d2Valid ? Math.min(Math.max(snapVal(endKey + '_d2') - snapVal(startKey + '_d2'), 0), 30) : 0;
                      // d3 for 3-day average
                      const d3Valid = snapVal(startKey + '_d3') > 0
                                      && snapVal(endKey + '_d3') > snapVal(startKey + '_d3');
                      const dz = d3Valid ? Math.min(Math.max(snapVal(endKey + '_d3') - snapVal(startKey + '_d3'), 0), 30) : 0;
                      // Average all available valid days
                      const validDays = [dt, dy, dz].filter(v => v > 0);
                      const kwh = validDays.length > 0
                        ? validDays.reduce((a, b) => a + b, 0) / validDays.length
                        : drainFlat * 6;
                      return kwh * (1 - forecastBias) / 6;
                    };
                    const bandKwByHour = (h) => {
                      if (h < 6)  return getBandKw('00', '06');
                      if (h < 12) return getBandKw('06', '12');
                      if (h < 18) return getBandKw('12', '18');
                      return getBandKw('18', '24');
                    };
                    const drainPer15 = (ts) => bandKwByHour(new Date(ts).getHours()) / 4;

                    // Build solar map: ts -> kW (p50 estimate, 30-min periods)
                    const solMap = {};
                    ['forecast_today','forecast_tomorrow'].forEach(key => {
                      const fc = hass.states[`sensor.solcast_pv_forecast_${key}`]?.attributes?.detailedForecast || [];
                      fc.forEach(e => {
                        const ts = Math.floor(new Date(e.period_start).getTime() / 1000);
                        solMap[ts] = (e.pv_estimate || 0) * (1 + forecastBias);
                      });
                    });

                    // Build schedule map: ts -> {type, power_kw} for each 15-min slot
                    const schedMap = {};
                    for (let s = 1; s <= 40; s++) {
                      const id = String(s).padStart(2,'0');
                      if (hass.states[`input_boolean.schedule_${id}_enabled`]?.state !== 'on') continue;
                      const sType = hass.states[`input_select.schedule_${id}_type`]?.state;
                      const kw = parseFloat(hass.states[`input_number.schedule_${id}_power_kw`]?.state || 0);
                      const sStr = hass.states[`input_datetime.schedule_${id}_start`]?.state;
                      const eStr = hass.states[`input_datetime.schedule_${id}_end`]?.state;
                      if (!sStr || sStr === 'unknown') continue;
                      const localOffset = -new Date().getTimezoneOffset();
                      const offStr = (localOffset >= 0 ? '+' : '-') + String(Math.floor(Math.abs(localOffset)/60)).padStart(2,'0') + ':' + String(Math.abs(localOffset)%60).padStart(2,'0');
                      const st = Math.floor(new Date(sStr.replace(' ','T') + offStr).getTime() / 1000);
                      const et = Math.floor(new Date(eStr.replace(' ','T') + offStr).getTime() / 1000);
                      for (let t = st; t < et; t += 900) { schedMap[t] = {type: sType, kw}; }
                    }

                    const npAttr = hass.states['sensor.nordpool_kwh_se3_sek_0_200000_0']?.attributes;
                    const npSlots = (npAttr?.raw_today || []).concat(npAttr?.tomorrow_valid ? (npAttr?.raw_tomorrow || []) : []);
                    const npEnd = npSlots.length > 0 ? new Date(npSlots[npSlots.length-1].start).getTime() + 900000 : now.getTime() + 48*3600000;
                    const start = Math.floor(now.getTime() / 900000) * 900000;
                    const end = Math.min(start + 48 * 3600000, npEnd);
                    const xs = [], ys = [];
                    let soc = soc0 * cap;
                    for (let t = start; t <= end; t += 900000) {
                      const ts = t / 1000;
                      const slot = schedMap[ts];
                      const solPeriod = (Math.floor(ts / 1800)) * 1800;
                      const solKw = solMap[solPeriod] || 0;
                      const solKwh15 = solKw * 0.25;
                      // For the currently-active slot, only count the remaining fraction
                      const slotEnd = t + 900000;
                      const fraction = (t <= now.getTime() && now.getTime() < slotEnd)
                        ? (slotEnd - now.getTime()) / 900000
                        : 1.0;

                      if (slot) {
                        // Re-initialize from current SOC if previous gap set soc to null
                        if (soc === null) soc = soc0 * cap;
                        if (slot.type === 'qEMS Battery Charge') {
                          soc = Math.min(soc + learnedAcceptance(soc, slot.kw) * 0.25 * fraction, cap);
                        } else if (slot.type === 'qEMS Battery Discharge') {
                          // Requested power is a discharge floor; house demand after PV may require more.
                          const houseKw = drainPer15(t) * 4;
                          const batteryKw = Math.max(slot.kw, houseKw - solKw, 0);
                          soc = Math.max(soc - batteryKw * 0.25 * fraction, 0);
                        } else if (slot.type === 'qEMS Battery Freeze') {
                          // Battery untouched — grid covers load, SOC unchanged.
                        } else if (slot.type === 'qEMS PV Charge+House') {
                          // PV covers house first; surplus charges battery and battery never discharges.
                          const surplusKw = Math.max(solKw - drainPer15(t) * 4, 0);
                          soc = Math.min(soc + learnedAcceptance(soc, surplusKw) * 0.25 * fraction, cap);
                        } else if (slot.type === 'qEMS Feed-In') {
                          // PV is exported after house demand; battery covers any PV deficit.
                          const netDrain = Math.max(drainPer15(t) - solKwh15, 0) * fraction;
                          soc = Math.max(soc - netDrain, 0);
                        } else if (slot.type === 'qEMS PV Charge') {
                          // All solar charges battery; grid supplies the complete house load.
                          soc = Math.min(soc + learnedAcceptance(soc, solKw) * 0.25 * fraction, cap);
                        } else {
                          // Self-Consumption and qEMS Self-Consumption: solar first, battery balances grid.
                          const netDrain = Math.max(drainPer15(t) - solKwh15, 0) * fraction;
                          const netChargeKw = Math.max(solKw - drainPer15(t) * 4, 0);
                          const netCharge = learnedAcceptance(soc, netChargeKw) * 0.25 * fraction;
                          soc = Math.max(Math.min(soc + netCharge, cap) - netDrain, 0);
                        }
                      } else {
                        // Unscheduled: apply post-schedule behaviour
                        const pb = hass.states['input_select.schedule_post_behavior']?.state || 'Self-Consumption';
                        if (pb === 'Restore Previous' || pb === 'Do Nothing') {
                          soc = null;
                        } else if (pb === 'qEMS Battery Freeze' || pb === 'qEMS Battery Charge') {
                          // Post-behavior qEMS Battery Charge starts at 0 kW; SOC is unchanged.
                        } else if (pb === 'qEMS Feed-In' || pb === 'qEMS Battery Discharge') {
                          if (soc !== null) soc = Math.max(soc - Math.max(drainPer15(t) - solKwh15, 0), 0);
                        } else if (pb === 'qEMS PV Charge+House') {
                          if (soc !== null) {
                            const surplusKw = Math.max(solKw - drainPer15(t) * 4, 0);
                            soc = Math.min(soc + learnedAcceptance(soc, surplusKw) * 0.25, cap);
                          }
                        } else if (pb === 'qEMS PV Charge') {
                          if (soc !== null) soc = Math.min(soc + learnedAcceptance(soc, solKw) * 0.25, cap);
                        } else {
                          if (soc !== null) {
                            const netDrain = Math.max(drainPer15(t) - solKwh15, 0);
                            const netChargeKw = Math.max(solKw - drainPer15(t) * 4, 0);
                            const netCharge = learnedAcceptance(soc, netChargeKw) * 0.25;
                            soc = Math.max(Math.min(soc + netCharge, cap) - netDrain, 0);
                          }
                        }
                      }
                      const d = new Date(t);
                      const pad = n => String(n).padStart(2,'0');
                      xs.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
                        +'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00');
                      ys.push(soc !== null ? (soc / cap * 100) : null);
                    }
                    return xs;
                  }
                "y": |
                  $fn ({hass}) => {
                    const now = new Date();
                    const capState = hass.states['sensor.solax_inverter_battery_rated_capacity']?.state;
                    const cap = parseFloat(capState) / 1000 || 20.4;
                    const socRaw = parseFloat(hass.states['sensor.youems_operational_shadow_soc']?.state || 50) / 100;
                    const dryRun = hass.states['input_boolean.dry_run']?.state === 'on';
                    const dryOffset = dryRun
                      ? parseFloat(hass.states['input_number.dry_run_battery_offset_pct']?.state || 0) / 100
                      : 0;
                    const soc0 = Math.min(Math.max(socRaw * (1 + dryOffset), 0), 1);
                    const curve = hass.states['sensor.youems_charge_acceptance_curve']?.attributes?.curve_kw || [];
                    const chargeBucketIndex = (pct) => {
                      let idx;
                      if (pct < 62) idx = Math.floor((pct - 10) / 5);
                      else if (pct < 85) idx = 11 + Math.floor((pct - 62) / 2);
                      else idx = 23 + Math.floor(pct - 85);
                      return Math.max(0, Math.min(37, idx));
                    };
                    const learnedAcceptance = (socKwh, requestedKw) => {
                      if (!Array.isArray(curve) || curve.length !== 38 || !Number.isFinite(requestedKw) || requestedKw <= 0) return Math.max(requestedKw || 0, 0);
                      const pct = cap > 0 ? socKwh / cap * 100 : 0;
                      const idx = chargeBucketIndex(pct);
                      const learned = parseFloat(curve[idx] || 0);
                      return learned > 0 ? Math.min(requestedKw, learned) : requestedKw;
                    };
                    const snap1 = parseFloat(hass.states['input_number.house_energy_snapshot_d1']?.state || 0);
                    const snap2 = parseFloat(hass.states['input_number.house_energy_snapshot_d2']?.state || 0);
                    const snap3 = parseFloat(hass.states['input_number.house_energy_snapshot_d3']?.state || 0);
                    const dy = Math.min(Math.max(snap1 - snap2, 0), 100);
                    const dd = Math.min(Math.max(snap2 - snap3, 0), 100);
                    const avgDaily = (dy > 0 && dd > 0) ? (dy + dd) / 2 : dy > 0 ? dy : 20;
                    // Use bias last written by schedule generation; fall back to active card value
                    const _scheduleBias = hass.states['input_number.schedule_forecast_bias']?.state;
                    const _invLocked = hass.states['input_boolean.auto_inverter_settings_locked']?.state === 'on';
                    const _cardBias = parseFloat(hass.states[_invLocked
                      ? 'input_number.auto_inverter_forecast_bias'
                      : 'input_number.auto_charge_forecast_bias']?.state || 0);
                    const forecastBias = (_scheduleBias && _scheduleBias !== 'unknown' && _scheduleBias !== 'unavailable')
                      ? parseFloat(_scheduleBias) / 100
                      : _cardBias / 100;
                    const drainFlat = avgDaily / 24; // raw kW fallback; forecast bias is applied once in getBandKw
                    // Band drain kW — delta between band boundaries, 2-day average
                    const snapVal = (key) => parseFloat(hass.states['input_number.house_snapshot_' + key]?.state || 0);
                    const getBandKw = (startKey, endKey) => {
                      // For each band, a "complete" window means both start and end snapshots
                      // have been captured in the same cycle day (d1 = today, d2 = yesterday).
                      // A snapshot's d1 is valid for a band only after the END snapshot fires.
                      // Before that, use d2 (yesterday's complete window).
                      const nowH = new Date().getHours();
                      let dt = 0, dy = 0;
                      // Band end hour: 06→6, 12→12, 18→18, 00→24(midnight)
                      const endHour = endKey === '00' ? 24 : endKey === '24' ? 24 : parseInt(endKey);
                      // Today's d1 window is complete only if current hour >= endHour
                      // d1 valid only if: period complete (end captured) AND positive delta
                      // startKey d1 being non-zero proves it was captured today (zeroed at midnight)
                      const d1Complete = nowH >= endHour
                                         && snapVal(startKey + '_d1') > 0
                                         && snapVal(endKey + '_d1') > snapVal(startKey + '_d1');
                      if (d1Complete) {
                        dt = Math.min(Math.max(snapVal(endKey + '_d1') - snapVal(startKey + '_d1'), 0), 30);
                      }
                      // d2 valid only if positive delta
                      const d2Valid = snapVal(startKey + '_d2') > 0
                                      && snapVal(endKey + '_d2') > snapVal(startKey + '_d2');
                      dy = d2Valid ? Math.min(Math.max(snapVal(endKey + '_d2') - snapVal(startKey + '_d2'), 0), 30) : 0;
                      // d3 for 3-day average
                      const d3Valid = snapVal(startKey + '_d3') > 0
                                      && snapVal(endKey + '_d3') > snapVal(startKey + '_d3');
                      const dz = d3Valid ? Math.min(Math.max(snapVal(endKey + '_d3') - snapVal(startKey + '_d3'), 0), 30) : 0;
                      // Average all available valid days
                      const validDays = [dt, dy, dz].filter(v => v > 0);
                      const kwh = validDays.length > 0
                        ? validDays.reduce((a, b) => a + b, 0) / validDays.length
                        : drainFlat * 6;
                      return kwh * (1 - forecastBias) / 6;
                    };
                    const bandKwByHour = (h) => {
                      if (h < 6)  return getBandKw('00', '06');
                      if (h < 12) return getBandKw('06', '12');
                      if (h < 18) return getBandKw('12', '18');
                      return getBandKw('18', '24');
                    };
                    const drainPer15 = (ts) => bandKwByHour(new Date(ts).getHours()) / 4;
                    const solMap = {};
                    ['forecast_today','forecast_tomorrow'].forEach(key => {
                      const fc = hass.states[`sensor.solcast_pv_forecast_${key}`]?.attributes?.detailedForecast || [];
                      fc.forEach(e => {
                        const ts = Math.floor(new Date(e.period_start).getTime() / 1000);
                        solMap[ts] = (e.pv_estimate || 0) * (1 + forecastBias);
                      });
                    });
                    const schedMap = {};
                    for (let s = 1; s <= 40; s++) {
                      const id = String(s).padStart(2,'0');
                      if (hass.states[`input_boolean.schedule_${id}_enabled`]?.state !== 'on') continue;
                      const sType = hass.states[`input_select.schedule_${id}_type`]?.state;
                      const kw = parseFloat(hass.states[`input_number.schedule_${id}_power_kw`]?.state || 0);
                      const sStr = hass.states[`input_datetime.schedule_${id}_start`]?.state;
                      const eStr = hass.states[`input_datetime.schedule_${id}_end`]?.state;
                      if (!sStr || sStr === 'unknown') continue;
                      const localOffset = -new Date().getTimezoneOffset();
                      const offStr = (localOffset >= 0 ? '+' : '-') + String(Math.floor(Math.abs(localOffset)/60)).padStart(2,'0') + ':' + String(Math.abs(localOffset)%60).padStart(2,'0');
                      const st = Math.floor(new Date(sStr.replace(' ','T') + offStr).getTime() / 1000);
                      const et = Math.floor(new Date(eStr.replace(' ','T') + offStr).getTime() / 1000);
                      for (let t = st; t < et; t += 900) { schedMap[t] = {type: sType, kw}; }
                    }
                    const npAttr2 = hass.states['sensor.nordpool_kwh_se3_sek_0_200000_0']?.attributes;
                    const npSlots2 = (npAttr2?.raw_today || []).concat(npAttr2?.tomorrow_valid ? (npAttr2?.raw_tomorrow || []) : []);
                    const npEnd2 = npSlots2.length > 0 ? new Date(npSlots2[npSlots2.length-1].start).getTime() + 900000 : now.getTime() + 48*3600000;
                    const start = Math.floor(now.getTime() / 900000) * 900000;
                    const end = Math.min(start + 48 * 3600000, npEnd2);
                    const xs = [], ys = [];
                    let soc = soc0 * cap;
                    for (let t = start; t <= end; t += 900000) {
                      const ts = t / 1000;
                      const slot = schedMap[ts];
                      const solPeriod = (Math.floor(ts / 1800)) * 1800;
                      const solKw = solMap[solPeriod] || 0;
                      const solKwh15 = solKw * 0.25;
                      const slotEnd2 = t + 900000;
                      const fraction2 = (t <= now.getTime() && now.getTime() < slotEnd2)
                        ? (slotEnd2 - now.getTime()) / 900000
                        : 1.0;
                      if (slot) {
                        // Re-initialize from current SOC if previous gap set soc to null
                        if (soc === null) soc = soc0 * cap;
                        if (slot.type === 'qEMS Battery Charge') {
                          soc = Math.min(soc + learnedAcceptance(soc, slot.kw) * 0.25 * fraction2, cap);
                        } else if (slot.type === 'qEMS Battery Discharge') {
                          const houseKw = drainPer15(t) * 4;
                          const batteryKw = Math.max(slot.kw, houseKw - solKw, 0);
                          soc = Math.max(soc - batteryKw * 0.25 * fraction2, 0);
                        } else if (slot.type === 'qEMS Battery Freeze') {
                          // Battery untouched — grid covers load, SOC unchanged.
                        } else if (slot.type === 'qEMS PV Charge+House') {
                          const surplusKw = Math.max(solKw - drainPer15(t) * 4, 0);
                          soc = Math.min(soc + learnedAcceptance(soc, surplusKw) * 0.25 * fraction2, cap);
                        } else if (slot.type === 'qEMS Feed-In') {
                          const netDrain = Math.max(drainPer15(t) - solKwh15, 0) * fraction2;
                          soc = Math.max(soc - netDrain, 0);
                        } else if (slot.type === 'qEMS PV Charge') {
                          soc = Math.min(soc + learnedAcceptance(soc, solKw) * 0.25 * fraction2, cap);
                        } else {
                          const netDrain = Math.max(drainPer15(t) - solKwh15, 0) * fraction2;
                          const netChargeKw = Math.max(solKw - drainPer15(t) * 4, 0);
                          const netCharge = learnedAcceptance(soc, netChargeKw) * 0.25 * fraction2;
                          soc = Math.max(Math.min(soc + netCharge, cap) - netDrain, 0);
                        }
                      } else {
                        const pb = hass.states['input_select.schedule_post_behavior']?.state || 'Self-Consumption';
                        if (pb === 'Restore Previous' || pb === 'Do Nothing') {
                          soc = null;
                        } else if (pb === 'qEMS Battery Freeze' || pb === 'qEMS Battery Charge') {
                          // Post-behavior qEMS Battery Charge starts at 0 kW; SOC is unchanged.
                        } else if (pb === 'qEMS Feed-In' || pb === 'qEMS Battery Discharge') {
                          if (soc !== null) soc = Math.max(soc - Math.max(drainPer15(t) - solKwh15, 0), 0);
                        } else if (pb === 'qEMS PV Charge+House') {
                          if (soc !== null) {
                            const surplusKw = Math.max(solKw - drainPer15(t) * 4, 0);
                            soc = Math.min(soc + learnedAcceptance(soc, surplusKw) * 0.25, cap);
                          }
                        } else if (pb === 'qEMS PV Charge') {
                          if (soc !== null) soc = Math.min(soc + learnedAcceptance(soc, solKw) * 0.25, cap);
                        } else {
                          if (soc !== null) {
                            const netDrain = Math.max(drainPer15(t) - solKwh15, 0);
                            const netChargeKw = Math.max(solKw - drainPer15(t) * 4, 0);
                            const netCharge = learnedAcceptance(soc, netChargeKw) * 0.25;
                            soc = Math.max(Math.min(soc + netCharge, cap) - netDrain, 0);
                          }
                        }
                      }
                      ys.push(soc !== null ? (soc / cap * 100) : null);
                    }
                    return ys;
                  }
                customdata: |
                  $fn ({hass}) => {
                    const now = new Date();
                    const capState = hass.states['sensor.solax_inverter_battery_rated_capacity']?.state;
                    const cap = parseFloat(capState) / 1000 || 20.4;
                    const socRaw = parseFloat(hass.states['sensor.youems_operational_shadow_soc']?.state || 50) / 100;
                    const dryRun = hass.states['input_boolean.dry_run']?.state === 'on';
                    const dryOffset = dryRun
                      ? parseFloat(hass.states['input_number.dry_run_battery_offset_pct']?.state || 0) / 100
                      : 0;
                    const soc0 = Math.min(Math.max(socRaw * (1 + dryOffset), 0), 1);
                    const curve = hass.states['sensor.youems_charge_acceptance_curve']?.attributes?.curve_kw || [];
                    const assumedMaxKw = parseFloat(hass.states['input_number.qems_max_target_kw']?.state || 10);
                    const chargeBucketIndex = (pct) => {
                      let idx;
                      if (pct < 62) idx = Math.floor((pct - 10) / 5);
                      else if (pct < 85) idx = 11 + Math.floor((pct - 62) / 2);
                      else idx = 23 + Math.floor(pct - 85);
                      return Math.max(0, Math.min(37, idx));
                    };
                    const acceptanceInfo = (socKwh, requestedKw) => {
                      if (!Number.isFinite(requestedKw) || requestedKw <= 0 || socKwh === null || socKwh >= cap - 0.001) {
                        return {accepted: 0, label: ''};
                      }
                      const curveValid = Array.isArray(curve) && curve.length === 38;
                      const pct = cap > 0 ? socKwh / cap * 100 : 0;
                      const idx = chargeBucketIndex(pct);
                      const learned = curveValid ? parseFloat(curve[idx] || 0) : 0;
                      if (learned > 0) {
                        return {
                          accepted: Math.min(requestedKw, learned),
                          label: `(⚡≤${learned.toFixed(1)} kW)`
                        };
                      }
                      // Unlearned bucket: planner/Plotly assume the full requested power can be absorbed.
                      // The starred hover ceiling is the configured qEMS maximum, marking it as an assumption.
                      return {
                        accepted: requestedKw,
                        label: `(⚡≤${Math.max(assumedMaxKw, 0).toFixed(1)} kW*)`
                      };
                    };
                    const snap1 = parseFloat(hass.states['input_number.house_energy_snapshot_d1']?.state || 0);
                    const snap2 = parseFloat(hass.states['input_number.house_energy_snapshot_d2']?.state || 0);
                    const snap3 = parseFloat(hass.states['input_number.house_energy_snapshot_d3']?.state || 0);
                    const dy = Math.min(Math.max(snap1 - snap2, 0), 100);
                    const dd = Math.min(Math.max(snap2 - snap3, 0), 100);
                    const avgDaily = (dy > 0 && dd > 0) ? (dy + dd) / 2 : dy > 0 ? dy : 20;
                    const _scheduleBias = hass.states['input_number.schedule_forecast_bias']?.state;
                    const _invLocked = hass.states['input_boolean.auto_inverter_settings_locked']?.state === 'on';
                    const _cardBias = parseFloat(hass.states[_invLocked
                      ? 'input_number.auto_inverter_forecast_bias'
                      : 'input_number.auto_charge_forecast_bias']?.state || 0);
                    const forecastBias = (_scheduleBias && _scheduleBias !== 'unknown' && _scheduleBias !== 'unavailable')
                      ? parseFloat(_scheduleBias) / 100
                      : _cardBias / 100;
                    const drainFlat = avgDaily / 24;
                    const snapVal = (key) => parseFloat(hass.states['input_number.house_snapshot_' + key]?.state || 0);
                    const getBandKw = (startKey, endKey) => {
                      const nowH = new Date().getHours();
                      let dt = 0, dy = 0;
                      const endHour = endKey === '00' ? 24 : endKey === '24' ? 24 : parseInt(endKey);
                      const d1Complete = nowH >= endHour
                                         && snapVal(startKey + '_d1') > 0
                                         && snapVal(endKey + '_d1') > snapVal(startKey + '_d1');
                      if (d1Complete) {
                        dt = Math.min(Math.max(snapVal(endKey + '_d1') - snapVal(startKey + '_d1'), 0), 30);
                      }
                      const d2Valid = snapVal(startKey + '_d2') > 0
                                      && snapVal(endKey + '_d2') > snapVal(startKey + '_d2');
                      dy = d2Valid ? Math.min(Math.max(snapVal(endKey + '_d2') - snapVal(startKey + '_d2'), 0), 30) : 0;
                      const d3Valid = snapVal(startKey + '_d3') > 0
                                      && snapVal(endKey + '_d3') > snapVal(startKey + '_d3');
                      const dz = d3Valid ? Math.min(Math.max(snapVal(endKey + '_d3') - snapVal(startKey + '_d3'), 0), 30) : 0;
                      const validDays = [dt, dy, dz].filter(v => v > 0);
                      const kwh = validDays.length > 0
                        ? validDays.reduce((a, b) => a + b, 0) / validDays.length
                        : drainFlat * 6;
                      return kwh * (1 - forecastBias) / 6;
                    };
                    const bandKwByHour = (h) => {
                      if (h < 6)  return getBandKw('00', '06');
                      if (h < 12) return getBandKw('06', '12');
                      if (h < 18) return getBandKw('12', '18');
                      return getBandKw('18', '24');
                    };
                    const drainPer15 = (ts) => bandKwByHour(new Date(ts).getHours()) / 4;
                    const solMap = {};
                    ['forecast_today','forecast_tomorrow'].forEach(key => {
                      const fc = hass.states[`sensor.solcast_pv_forecast_${key}`]?.attributes?.detailedForecast || [];
                      fc.forEach(e => {
                        const ts = Math.floor(new Date(e.period_start).getTime() / 1000);
                        solMap[ts] = (e.pv_estimate || 0) * (1 + forecastBias);
                      });
                    });
                    const schedMap = {};
                    for (let s = 1; s <= 40; s++) {
                      const id = String(s).padStart(2,'0');
                      if (hass.states[`input_boolean.schedule_${id}_enabled`]?.state !== 'on') continue;
                      const sType = hass.states[`input_select.schedule_${id}_type`]?.state;
                      const kw = parseFloat(hass.states[`input_number.schedule_${id}_power_kw`]?.state || 0);
                      const sStr = hass.states[`input_datetime.schedule_${id}_start`]?.state;
                      const eStr = hass.states[`input_datetime.schedule_${id}_end`]?.state;
                      if (!sStr || sStr === 'unknown') continue;
                      const localOffset = -new Date().getTimezoneOffset();
                      const offStr = (localOffset >= 0 ? '+' : '-') + String(Math.floor(Math.abs(localOffset)/60)).padStart(2,'0') + ':' + String(Math.abs(localOffset)%60).padStart(2,'0');
                      const st = Math.floor(new Date(sStr.replace(' ','T') + offStr).getTime() / 1000);
                      const et = Math.floor(new Date(eStr.replace(' ','T') + offStr).getTime() / 1000);
                      for (let t = st; t < et; t += 900) { schedMap[t] = {type: sType, kw}; }
                    }
                    const npAttr2 = hass.states['sensor.nordpool_kwh_se3_sek_0_200000_0']?.attributes;
                    const npSlots2 = (npAttr2?.raw_today || []).concat(npAttr2?.tomorrow_valid ? (npAttr2?.raw_tomorrow || []) : []);
                    const npEnd2 = npSlots2.length > 0 ? new Date(npSlots2[npSlots2.length-1].start).getTime() + 900000 : now.getTime() + 48*3600000;
                    const start = Math.floor(now.getTime() / 900000) * 900000;
                    const end = Math.min(start + 48 * 3600000, npEnd2);
                    const labels = [];
                    let soc = soc0 * cap;
                    for (let t = start; t <= end; t += 900000) {
                      const ts = t / 1000;
                      const slot = schedMap[ts];
                      const solPeriod = (Math.floor(ts / 1800)) * 1800;
                      const solKw = solMap[solPeriod] || 0;
                      const solKwh15 = solKw * 0.25;
                      const slotEnd = t + 900000;
                      const fraction = (t <= now.getTime() && now.getTime() < slotEnd)
                        ? (slotEnd - now.getTime()) / 900000
                        : 1.0;
                      let chargeLabel = '';

                      if (slot) {
                        if (soc === null) soc = soc0 * cap;
                        if (slot.type === 'qEMS Battery Charge') {
                          const a = acceptanceInfo(soc, slot.kw);
                          chargeLabel = a.label;
                          soc = Math.min(soc + a.accepted * 0.25 * fraction, cap);
                        } else if (slot.type === 'qEMS Battery Discharge') {
                          const houseKw = drainPer15(t) * 4;
                          const batteryKw = Math.max(slot.kw, houseKw - solKw, 0);
                          soc = Math.max(soc - batteryKw * 0.25 * fraction, 0);
                        } else if (slot.type === 'qEMS Battery Freeze') {
                          // Battery untouched.
                        } else if (slot.type === 'qEMS PV Charge+House') {
                          const surplusKw = Math.max(solKw - drainPer15(t) * 4, 0);
                          const a = acceptanceInfo(soc, surplusKw);
                          chargeLabel = a.label;
                          soc = Math.min(soc + a.accepted * 0.25 * fraction, cap);
                        } else if (slot.type === 'qEMS Feed-In') {
                          const netDrain = Math.max(drainPer15(t) - solKwh15, 0) * fraction;
                          soc = Math.max(soc - netDrain, 0);
                        } else if (slot.type === 'qEMS PV Charge') {
                          const a = acceptanceInfo(soc, solKw);
                          chargeLabel = a.label;
                          soc = Math.min(soc + a.accepted * 0.25 * fraction, cap);
                        } else {
                          const netDrain = Math.max(drainPer15(t) - solKwh15, 0) * fraction;
                          const netChargeKw = Math.max(solKw - drainPer15(t) * 4, 0);
                          const a = acceptanceInfo(soc, netChargeKw);
                          chargeLabel = a.label;
                          soc = Math.max(Math.min(soc + a.accepted * 0.25 * fraction, cap) - netDrain, 0);
                        }
                      } else {
                        const pb = hass.states['input_select.schedule_post_behavior']?.state || 'Self-Consumption';
                        if (pb === 'Restore Previous' || pb === 'Do Nothing') {
                          soc = null;
                        } else if (pb === 'qEMS Battery Freeze' || pb === 'qEMS Battery Charge') {
                          // Post-behavior qEMS Battery Charge starts at 0 kW.
                        } else if (pb === 'qEMS Feed-In' || pb === 'qEMS Battery Discharge') {
                          if (soc !== null) soc = Math.max(soc - Math.max(drainPer15(t) - solKwh15, 0), 0);
                        } else if (pb === 'qEMS PV Charge+House') {
                          if (soc !== null) {
                            const surplusKw = Math.max(solKw - drainPer15(t) * 4, 0);
                            const a = acceptanceInfo(soc, surplusKw);
                            chargeLabel = a.label;
                            soc = Math.min(soc + a.accepted * 0.25, cap);
                          }
                        } else if (pb === 'qEMS PV Charge') {
                          if (soc !== null) {
                            const a = acceptanceInfo(soc, solKw);
                            chargeLabel = a.label;
                            soc = Math.min(soc + a.accepted * 0.25, cap);
                          }
                        } else {
                          if (soc !== null) {
                            const netDrain = Math.max(drainPer15(t) - solKwh15, 0);
                            const netChargeKw = Math.max(solKw - drainPer15(t) * 4, 0);
                            const a = acceptanceInfo(soc, netChargeKw);
                            chargeLabel = a.label;
                            soc = Math.max(Math.min(soc + a.accepted * 0.25, cap) - netDrain, 0);
                          }
                        }
                      }
                      labels.push(chargeLabel);
                    }
                    return labels;
                  }
