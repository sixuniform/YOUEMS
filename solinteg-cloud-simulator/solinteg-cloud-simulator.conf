# Network interface on the Linux interception host that receives the routed
# packet from the LAN router.
LAN_INTERFACE=enxb827ebf678ea

# Linux interception host and Solinteg communication-module addresses.
SIMULATOR_ADDRESS=192.168.10.50
INVERTER_ADDRESS=192.168.10.99

# Confirmed Solinteg cloud telemetry endpoint. Do not broaden this to a /24.
CLOUD_ADDRESS=8.211.16.247
LISTEN_PORT=5743

# Optional diagnostics. Leave empty for normal operation. Examples:
# SIMULATOR_OPTIONS=--verbose
# SIMULATOR_OPTIONS=--log-unknown
# SIMULATOR_OPTIONS="--verbose --log-unknown"
# SIMULATOR_OPTIONS="--forward-socks5 192.168.0.1:1080"
SIMULATOR_OPTIONS=

# Optional SOCKS5 username/password authentication. Leave both unset for a
# proxy that trusts the VPN/source network. These are read from the service
# environment and are not placed in its process command line.
# SOLINTEG_SOCKS5_USERNAME=example-user
# SOLINTEG_SOCKS5_PASSWORD=example-password
