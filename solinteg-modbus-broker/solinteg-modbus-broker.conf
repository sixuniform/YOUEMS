# /etc/default/solinteg-modbus-broker
# SPDX-License-Identifier: Apache-2.0

# Local listeners.
BROKER_IP=0.0.0.0
READONLY_PORT=502
READWRITE_PORT=503

# Solinteg inverter Modbus/TCP endpoint.
INVERTER_IP=192.168.10.152
INVERTER_PORT=502
UNIT_ID=255

# Upstream request timeout. Solinteg units can occasionally take several
# seconds to answer one block even while the TCP connection remains healthy.
UPSTREAM_TIMEOUT_SECONDS=10.0

# Reconnect sequence is immediate, then 0.1, 0.2, 0.4 ... up to this cap.
RECONNECT_BACKOFF_INITIAL_SECONDS=0.1
RECONNECT_BACKOFF_MAX_SECONDS=5.0
RECONNECT_BACKOFF_RESET_SECONDS=60.0

# Runtime files installed by install.sh.
SOLINTEG_MODBUS_MAP_PATH=/opt/solinteg-modbus-broker/solinteg_modbus_map.py
MODBUS_RULES_PATH=/etc/solinteg-modbus-broker/modbus_rules.json
